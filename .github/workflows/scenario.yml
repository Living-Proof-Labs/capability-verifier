          def _cmark_utf8_punct(code: int) -> bool:
              """True when cmark_utf8proc_is_punctuation accepts this code point."""
              if code < 128:
                  # cmark_ispunct, src/cmark_ctype.c class 2.
                  return (
                      0x21 <= code <= 0x2F
                      or 0x3A <= code <= 0x40
                      or 0x5B <= code <= 0x60
                      or 0x7B <= code <= 0x7E
                  )
              return code in _CMARK_PUNCT


          def _cmark_utf8_space(ch: str) -> bool:
              """cmark_utf8proc_is_space, src/utf8.c: Zs plus TAB, LF, FF and CR.

              NBSP (160), U+2000-U+200A (including em space U+2003) and U+3000 are spaces.
              U+2028 and U+2029 are not. is_valid_hostchar rejects this set.
              """
              code = ord(ch)
              return code in (9, 10, 12, 13, 32, 160, 5760, 8239, 8287, 12288) or 8192 <= code <= 8202


          def _is_host_char(ch: str) -> bool:
              """True when cmark-gfm's is_valid_hostchar would keep this in a host label.

              Space is cmark_utf8proc_is_space. Non-ASCII punctuation is
              cmark_utf8proc_is_punctuation's list, not Unicode category P.
              """
              if _cmark_utf8_space(ch):
                  return False
              code = ord(ch)
              if code < 128:
                  return ch.isalnum()
              return not _cmark_utf8_punct(code)


          def _check_domain(text: str, *, allow_short: bool) -> int:
              """0 when cmark-gfm's check_domain rejects the host, and non-zero when it accepts.

              cmark walks UTF-8 bytes and returns a byte length. ``_url_span`` and ``_www_span`` use
              only the zero test, then scan the rest of the address by code point, so this returns a
              code-point index solely as that accept/reject flag. A non-ASCII first character makes
              byte 1 a continuation byte and the C loop stops at once (length 1, or 0 for ``www``).
              A later non-ASCII character is stopped the same way: its lead byte may be a host
              character, and the continuation byte never is. A backslash is skipped and the next
              character is examined, so ``x\\_y`` counts the underscore.
              """
              if not text:
                  return 0
              size = len(text)
              i = 1
              uscore1 = 0
              uscore2 = 0
              dots = 0
              if ord(text[0]) > 127:
                  # cmark scans bytes: index 1 is a UTF-8 continuation byte, so the loop stops at once.
                  return 1 if allow_short else 0
              while i < size - 1:
                  ch = text[i]
                  if ch == "\\" and i < size - 2:
                      # cmark: skip the backslash, then examine the escaped character.
                      i += 1
                      ch = text[i]
                  if ord(ch) > 127:
                      # The lead byte may be a host character, but the continuation byte never is.
                      break
                  if ch == "_":
                      uscore2 += 1
                  elif ch == ".":
                      uscore1 = uscore2
                      uscore2 = 0
                      dots += 1
                  elif ch != "-" and not _is_host_char(ch):
                      break
                  i += 1
              if (uscore1 or uscore2) and dots <= 10:
                  return 0
              if allow_short:
                  return i
              return i if dots else 0


          def _autolink_end(text: str, start: int) -> int:
              end = start
              size = len(text)
              while end < size and text[end] not in _CMARK_SPACE and text[end] != "<":
                  end += 1
              return end


          def _autolink_delim(text: str) -> int:
              """Exclusive end of the link cmark-gfm keeps. The rest is trailing punctuation.

              Same rules as cmark's ``autolink_delim``: trim ``?!.,:*_~'"``, drop an unbalanced
              ``)``, and drop a trailing ``&name;``. Those characters are not part of the link, so
              leaving ``*``, ``_`` or ``~`` raw lets them emphasise or strike the words that follow.
              """
              link_end = len(text)
              opening = 0
              closing = 0
              for index, ch in enumerate(text):
                  if ch == "<":
                      link_end = index
                      break
                  if ch == "(":
                      opening += 1
                  elif ch == ")":
                      closing += 1
              while link_end > 0:
                  ch = text[link_end - 1]
                  if ch == ")":
                      if closing <= opening:
                          return link_end
                      closing -= 1
                      link_end -= 1
                  elif ch in "?!.,:*_~'\"":
                      link_end -= 1
                  elif ch == ";":
                      new_end = link_end - 2
                      while new_end > 0 and text[new_end].isascii() and text[new_end].isalpha():
                          new_end -= 1
                      if new_end < link_end - 2 and text[new_end] == "&":
                          link_end = new_end
                      else:
                          link_end -= 1
                  else:
                      return link_end
              return link_end


          _TAIL_MARKS = frozenset("*_~")


          def _tail_can_mark(text: str) -> bool:
              return any(ch in _TAIL_MARKS for ch in text)


          def _span_can_be_angle_autolink(span: str) -> bool:
              """A raw ``<...>`` is safe only for a span that cannot itself open or close a tag."""
              if not span:
                  return False
              for ch in span:
                  if ch in "<>" or ch.isspace() or ord(ch) < 32 or ord(ch) == 127:
                      return False
              return True


          def _scheme_address(span: str) -> bool:
              return span.lower().startswith(("http://", "https://", "ftp://"))


          def _escape_trimmed_tail(text: str, *, keep_ampersand: bool) -> str:
              """Escape a trimmed tail. ``*``, ``_`` and ``~`` become ``\\*``, ``\\_`` and ``\\~``.

              A trailing ``&name;`` is left with a raw ``&`` when the tail is not shielded: ``\\&`` would
              be swallowed into the href, and cmark then decodes the entity to text. After an angle
              autolink the backslash is outside the link, so ``&`` is escaped normally.
              """
              escaped = _md_escape_text(text)
              if keep_ampersand:
                  return escaped.replace("\\&", "&")
              return escaped


          def _shield_address(kept: str, tail: str) -> str:
              """Keep a trimmed ``*``, ``_`` or ``~`` from emphasising the words after the address.

              A scheme address is wrapped in a CommonMark angle autolink, ``<https://e.com/a>``, and only
              when the tail needs it. ``www.`` is not a scheme, so it cannot be an angle autolink: the dot
              is escaped and the rest of the span is escaped, which leaves the characters visible and
              unlinked. A span that contains whitespace, ``<``, ``>`` or a control character is not
              wrapped; the scheme's slashes are escaped instead, so no raw bracket is written.
              """
              if kept.startswith("www."):
                  return "www\\." + _md_escape_text(kept[4:] + tail)
              if _scheme_address(kept) and _span_can_be_angle_autolink(kept):
                  assert _span_can_be_angle_autolink(kept)
                  # cmark decodes entities inside <...>, so '&' is written '&amp;' and the
                  # href and the visible address stay the original characters.
                  return (
                      "<"
                      + kept.replace("&", "&amp;")
                      + ">"
                      + _escape_trimmed_tail(tail, keep_ampersand=False)
                  )
              if _scheme_address(kept):
                  scheme = kept.lower().find("://")
                  return kept[:scheme] + ":\\/\\/" + _md_escape_text(kept[scheme + 3 :] + tail)
              return _md_escape_text(kept + tail)


          def _url_span(line: str, index: int) -> tuple[int, int] | None:
              if not line.startswith("://", index):
                  return None
              scheme = index
              while scheme > 0 and line[scheme - 1].isascii() and line[scheme - 1].isalpha():
                  scheme -= 1
              name = line[scheme:index].lower()
              if name not in _SCHEMES:
                  return None
              host = index + 3
              if host >= len(line) or not _is_host_char(line[host]):
                  return None
              if _check_domain(line[host:], allow_short=True) == 0:
                  return None
              end = _autolink_end(line, host)
              # A CommonMark angle autolink is '<scheme:...>'. Its closing '>' is a delimiter, not part of
              # the address. Leaving it in the span makes the extended autolink swallow it once '<' is '&lt;'.
              if scheme and line[scheme - 1] == "<":
                  close = line.find(">", host, end)
                  if close != -1:
                      end = close
              if end <= scheme:
                  return None
              return scheme, end


          def _www_span(line: str, index: int) -> tuple[int, int] | None:
              if not line.startswith("www.", index):
                  return None
              if index and line[index - 1] not in _AUTOLINK_BEFORE and line[index - 1] not in _CMARK_SPACE:
                  return None
              if _check_domain(line[index:], allow_short=False) == 0:
                  return None
              end = _autolink_end(line, index)
              if end <= index:
                  return None
              return index, end


          def _autolink_spans(line: str) -> list[tuple[int, int]]:
              spans: list[tuple[int, int]] = []
              index = 0
              while index < len(line):
                  found = _www_span(line, index) or _url_span(line, index)
                  if found is None:
                      index += 1
                      continue
                  spans.append(found)
                  index = found[1]
              return spans


          def _md_escape(line: str) -> str:
              """Backslash-escape what Markdown would act on, so an evaluator's message stays plain text.

              Only the span cmark-gfm will actually auto-link is copied through, after the same
              trailing-punctuation trim cmark applies. When that trimmed tail contains ``*``, ``_`` or
              ``~``, a scheme address is written as an angle autolink (``<https://e.com/a>\\~``) so the
              href stays the address and the mark is a backslash escape, not emphasis. The angle brackets
              are the only raw ``<`` and ``>`` this function writes. An ``https://`` run whose host is
              not a real link is escaped with everything else, and a ``<`` in the message is ``&lt;``.
              """
              parts: list[str] = []
              cursor = 0
              for start, end in _autolink_spans(line):
                  kept_end = start + _autolink_delim(line[start:end])
                  kept = line[start:kept_end]
                  tail = line[kept_end:end]
                  parts.append(_md_escape_text(line[cursor:start]))
                  if _tail_can_mark(tail):
                      parts.append(_shield_address(kept, tail))
                  else:
                      parts.append(kept)
                      parts.append(_escape_trimmed_tail(tail, keep_ampersand=True))
                  cursor = end
              parts.append(_md_escape_text(line[cursor:]))
              return "".join(parts)


          def _md_escape_text(text: str) -> str:
              pieces: list[str] = []
              pending: list[str] = []

              def flush() -> None:
                  if pending:
                      pieces.append(re.sub(r"([\\`*_~&\[\]|])", r"\\\1", "".join(pending)))
                      pending.clear()

              for ch in text:
                  if ch == "<":
                      flush()
                      pieces.append("&lt;")
                  elif ch == ">":
                      flush()
                      pieces.append("&gt;")
                  else:
                      pending.append(ch)
              flush()
              # A scheme or www. left in escaped text is still an autolink, and it swallows the
              # backslash in front of a following mark (autolink.c url_match / www_match).
              escaped = "".join(pieces)
              return escaped.replace("://", ":\\/\\/").replace("www.", "www\\.")


          def place_integrity_lines(report_dir: Path) -> bool:
              """Put the run-integrity lines next to the verdict in report.md, report.txt and report.html.

              The reporter does not know the integrity result, so the lines the collector wrote are placed
              after rendering: in Markdown and text right after each ``... overall <GRADE>.`` line, in HTML
              right after each stored-status paragraph, so no format shows a verdict without the state.
              Where the verdict is not found (a reporter that words it differently), the lines go at the
              end instead, and the first format never loses them. Returns False when there are no lines.
              """
              source = report_dir / INTEGRITY_FILE
              if not source.is_file():
                  return False
              lines = [line for line in source.read_text(encoding="utf-8").splitlines() if line.strip()]
              if not lines:
                  return False
              for name, blank in (("report.md", True), ("report.txt", False)):
                  path = report_dir / name
                  if not path.is_file():
                      continue
                  out: list[str] = []
                  placed = False
                  for line in path.read_text(encoding="utf-8").splitlines():
                      out.append(line)
                      if _VERDICT.search(line) and not line.startswith(("|", "<")):
                          for extra in lines:
                              shown = _md_escape(extra) if blank else extra
                              out += ["", shown] if blank else [shown]
                          placed = True
                  if not placed:
                      out += ["", *(_md_escape(x) if blank else x for x in lines)]
                  path.write_text("\n".join(out) + "\n", encoding="utf-8")
              page = report_dir / "report.html"
              if page.is_file():
                  text = page.read_text(encoding="utf-8")
                  shown = "".join(
                      f"<p class='stored-status integrity-status'>{html.escape(line, quote=False)}</p>"
                      for line in lines
                  )
                  text, count = _HTML_VERDICT.subn(lambda found: found.group(0) + shown, text)
                  if not count:
                      text = text.replace("<main class='wrap'>", "<main class='wrap'>" + shown, 1)
                  page.write_text(text, encoding="utf-8")
              return True


          def main(argv: list[str] | None = None) -> int:
              args = list(sys.argv[1:] if argv is None else argv)
              if len(args) == 2 and args[0] == "--place-integrity":
                  place_integrity_lines(Path(args[1]))
                  return 0
              if len(args) != 3:
                  print(
                      "usage: collect_evaluator_results.py BUNDLE_MANIFEST RESULTS_DIR REPORT_DIR\n"
                      "       collect_evaluator_results.py --place-integrity REPORT_DIR",
                      file=sys.stderr,
                  )
                  return 2
              manifest = Path(args[0])
              bundle = json.loads(manifest.read_text(encoding="utf-8"))
              counts: dict = {}
              try:
                  collect(
                      bundle,
                      Path(args[1]),
                      Path(args[2]),
                      counts,
                      integrity_job=os.environ.get("RUN_INTEGRITY_RESULT") or None,
                  )
              except ThresholdCitationError as exc:
                  print(str(exc), file=sys.stderr)
                  return 1
              trial_appended = counts.pop("_trial_appended", 0)
              problems = counts.pop("_problems", [])
              for label, where, reason in counts.pop("_unusable", []):
                  print(f"evaluator {label}: skipped (unusable result: {where}: {reason})")
              for line in problems:
                  print(f"evaluator result not collected: {line}", file=sys.stderr)
              if problems:
                  problems_path = Path(args[2]) / PROBLEMS_FILE
                  problems_path.parent.mkdir(parents=True, exist_ok=True)  # reports/ may not exist yet
                  problems_path.write_text("\n".join(problems) + "\n", encoding="utf-8")
              for name in sorted(counts):
                  tally = counts[name]
                  print(
                      f"evaluator {name}: appended {tally['appended']}, "
                      f"skipped {tally['skipped']} (trial not in this bundle)"
                  )
              trials = sum(1 for result in bundle["results"] if isinstance(result, dict))
              if trials == 0:
                  print("no trials in this bundle, so no evaluator result to append")
              elif trial_appended == 0:
                  pattern = os.environ.get("EVALUATOR_RESULTS_PATTERN") or "(EVALUATOR_RESULTS_PATTERN unset)"
                  print(
                      f"no evaluator result was appended to this bundle's {trials} trial(s). "
                      f"Expected result documents for these trials in {args[1]}, downloaded from "
                      f"artifacts matching {pattern}. Check the artifact name and prefix, and that "
                      "each result's scenario.trial_id is one of this bundle's result ids.",
                      file=sys.stderr,
                  )
                  return 1
              manifest.write_text(json.dumps(bundle, indent=2) + "\n", encoding="utf-8")
              return 0


          if __name__ == "__main__":
              sys.exit(main())

          COLLECT
          python3 /tmp/collect_evaluator_results.py verified/bundle/manifest.json evaluator-results reports
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.media.result == 'success'
        with:
          name: ${{ inputs.artifact-prefix }}links-${{ matrix.configuration }}
          path: links
      - name: Validate, then render the verifier's decisions (a capability FAIL exits 0)
        run: |
          if [ -f verified/reports/report.json ]; then
            mkdir -p reports
            cp -a verified/reports/. reports/
            (cd reports && sha256sum -c SHA256SUMS)
            exit 0
          fi
          livingproof-capability-report --version
          livingproof-capability-report validate verified/bundle/manifest.json
          mkdir -p reports
          set --
          if [ -f links/evidence-links.json ]; then set -- --evidence-links links/evidence-links.json; fi
          # Markdown and HTML are rendered from the bundle manifest, with the same
          # evidence-link args as the JSON report. Reporter >= 3.4.0 reads duration_s
          # from each trial observation next to that manifest (its parent directory).
          # report.json lives outside the bundle, so rendering HTML from it leaves
          # every Duration cell as an em dash. The terminal text stays a render of
          # the saved JSON report; it has no per-trial duration column.
          livingproof-capability-report render verified/bundle/manifest.json "$@" --format json -o reports/report.json
          livingproof-capability-report render verified/bundle/manifest.json "$@" --format markdown -o reports/report.md
          livingproof-capability-report render verified/bundle/manifest.json "$@" --format html -o reports/report.html
          livingproof-capability-report render reports/report.json > reports/report.txt
          # The run-integrity result goes next to the verdict in every format. The reporter has
          # no integrity input, so it is placed after rendering and before the sums.
          if [ -f reports/integrity-lines.txt ]; then
            python3 /tmp/collect_evaluator_results.py --place-integrity reports
          fi
          (cd reports && sha256sum report.* > SHA256SUMS)
          (cd reports && find . -type f -name thresholds.json -print | sed 's#^\./##' | LC_ALL=C sort | while IFS= read -r file; do sha256sum "$file" >> SHA256SUMS; done)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.artifact-prefix }}capability-report-${{ matrix.configuration }}
          path: reports/
          retention-days: 30
          if-no-files-found: error
      - name: Capability report in job summary
        run: cat reports/report.md >> "$GITHUB_STEP_SUMMARY"
  comment:
    # One PR comment for every configuration: the reporter renders and posts it (image
    # `comment` subcommand, reporter >= 1.10.0), updated in place under its hidden marker.
    needs: [plan, report]
    # Runs whatever media did (failed, skipped or disabled): only the report gates it.
    if: >-
      always() && needs.report.result == 'success' && inputs.comment && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (inputs.repository == '' || inputs.repository == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    container:
      image: ${{ needs.plan.outputs.reporter-image }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ${{ inputs.artifact-prefix }}capability-report-*
          path: reports
      - name: Post or update the capability-report comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: livingproof-capability-report comment --repo "$REPO" --pr "$PR" reports/*/report.md

  run-integrity:
    # Second evaluator job: livingproof-run-integrity (kind integrity,
    # execution deterministic) on the evidence artifact, after the robot
    # (scenario) evaluator in this file. Needs evidence, and the media job for the
    # recordings the recording check reads, so it waits for verify and media (report already
    # did). With media off, skipped or failed it runs without media.
    # Tag-only pin: checkout the tag, never a commit. Plan defaults the
    # pin to livingproof-evaluator-run v1.5.0 when the lock omits it.
    needs: [plan, evidence, media]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.plan.outputs.verifier-image }}
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        configuration: ${{ fromJSON(needs.plan.outputs.configurations) }}
    steps:
      - name: Capability verifier at the locked release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ needs.plan.outputs.verifier-repository }}
          ref: ${{ needs.plan.outputs.verifier-commit }}
          persist-credentials: false
      - if: needs.plan.outputs.verifier-image == ''
        run: python3 -m pip install --user uv==0.13.6
      - run: uv sync --locked
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.artifact-prefix }}evidence-${{ matrix.configuration }}
          path: evidence
      - name: Specs files the verifier loads, checked and recorded
        # Needs the manifest it reads. Without one (the evidence step left none), the
        # stand-in path below still gives a Run Integrity result.
        if: ${{ hashFiles('evidence/manifest.json') != '' }}
        # Writes evidence/specs-files.json beside manifest.json: the sha256 of each
        # declared specs file as read from the checkout, and the commit it resolved to.
        run: uv run --no-sync python tools/fetch_hallway_specs.py --from evidence/manifest.json --record evidence/specs-files.json
      - name: Recordings and media.json from the media job
        # media.json and mcap/, as the media job uploaded them, for this configuration.
        # needs.media.result is the matrix aggregate, so this step still attempts the
        # artifact when another media leg failed. If the aggregate succeeded and the
        # artifact is missing, the download fails (do not silently grade without
        # recordings). If the aggregate is not success and the artifact is missing,
        # continue without --media. A skipped media job (off, not media-capable, or
        # evidence failed) leaves no directory.
        if: ${{ needs.media.result != 'skipped' }}
        continue-on-error: ${{ needs.media.result != 'success' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.artifact-prefix }}mcap-${{ matrix.configuration }}
          path: media
      - name: Run Integrity evaluator at the locked pin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ needs.plan.outputs.run-integrity-repository }}
          ref: ${{ needs.plan.outputs.run-integrity-tag }}
          path: run-integrity
          persist-credentials: false
      - name: Run Integrity, one result for the run
        run: |
          uv sync --locked --directory run-integrity
          mkdir -p evaluator-results/livingproof-run-integrity
          manifest="$GITHUB_WORKSPACE/evidence/manifest.json"
          if [ ! -f "$manifest" ]; then
            # The evidence step left no manifest (killed, timed out, crashed). Evaluate a
            # stand-in that plans the run's trial count and has no trials, so the evaluator
            # reports every planned trial as missing in its own words. Whether and how the
            # step ended is in evidence/evidence-ending.json, which the stand-in carries.
            echo "evidence has no manifest.json; evaluating a stand-in manifest, without a manifest from the run" >&2
            status=0
            python3 - <<'PY' || status=$?
          import json, os, pathlib, sys
          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"])


          def no_result(reason):
              # The job fails here, naming the cause, instead of exiting 0 with nothing for
              # the upload to keep. no-result.txt is the file the upload keeps; it is not a
              # result document, so the report ignores it.
              message = f"no Run Integrity result for this run: {reason}"
              print(f"::error::{message}")
              target = workspace / "evaluator-results" / "livingproof-run-integrity"
              target.mkdir(parents=True, exist_ok=True)
              (target / "no-result.txt").write_text(message + "\n")
              sys.exit(3)


          try:
              ending = json.loads((workspace / "evidence" / "evidence-ending.json").read_text())
          except FileNotFoundError:
              no_result("evidence-ending.json is missing from the evidence artifact, so the planned trial count is unknown (the evidence job ended before its ending step ran, or ran a verifier release without it)")
          except (OSError, ValueError) as error:
              no_result(f"evidence-ending.json cannot be read ({type(error).__name__})")
          if not isinstance(ending, dict):
              no_result("evidence-ending.json is not a JSON object")
          if "planned_trials" not in ending:
              no_result("planned_trials is missing from evidence-ending.json")
          planned = ending["planned_trials"]
          if planned is None:
              no_result("planned_trials is null: the run's lock has no plan.trials.count")
          if not isinstance(planned, int) or isinstance(planned, bool):
              no_result(f"planned_trials is not a whole number: {planned!r}")
          if planned <= 0:
              no_result(f"planned_trials is {planned}: the evaluator does not take a plan with no trials")
          stand_in = {
              "run_id": f"no-evidence-{os.environ.get('GITHUB_RUN_ID', 'run')}-{ending.get('configuration')}",
              "plan": {"trials": {"count": planned}},
              "trials": {"count": planned, "results": []},
              "stand_in": {"reason": "the evidence step left no manifest.json", "ending": ending},
          }
          target = workspace / "no-evidence"
          target.mkdir(exist_ok=True)
          (target / "stand-in-manifest.json").write_text(json.dumps(stand_in, indent=2) + "\n")
          PY
            if [ "$status" -eq 3 ]; then
              exit 1
            fi
            if [ "$status" -ne 0 ]; then
              exit "$status"
            fi
            manifest="$GITHUB_WORKSPACE/no-evidence/stand-in-manifest.json"
          fi
          if [ -f evidence/specs-files.json ]; then
            cp evidence/specs-files.json evaluator-results/livingproof-run-integrity/specs-files.json
          fi
          # --media arrived in livingproof-evaluator-run v1.4.0. A pinned livingproof-evaluator-run
          # that does not list it in --help (v1.0.0 to v1.3.1) is not given it.
          # Match it as a whole flag so a longer option such as --media-dir is not treated as it.
          # Require media.json so a failed download that left an empty media/ is not given --media.
          set --
          if [ -f "$GITHUB_WORKSPACE/media/media.json" ]; then
            if PYTHONPATH=run-integrity/src uv run --no-sync --directory run-integrity \
                python -m livingproof_evaluator_run --help | grep -Eq -- '--media([^[:alnum:]-]|$)'; then
              set -- --media "$GITHUB_WORKSPACE/media"
            else
              echo "the pinned evaluator does not take --media; running without media"
            fi
          fi
          # Exit 2 is a refusal: no result is written. Keep the evaluator's own message in
          # refused.txt (not a result document, so the report ignores it as a result) so the report
          # can say REFUSED and why; any other failure is not a refusal. The job still fails.
          results="$GITHUB_WORKSPACE/evaluator-results/livingproof-run-integrity"
          status=0
          PYTHONPATH=run-integrity/src uv run --no-sync --directory run-integrity \
            python -m livingproof_evaluator_run \
            "$manifest" \
            "$@" \
            --out "$results/result.json" 2> "$results/evaluator-stderr.txt" || status=$?
          cat "$results/evaluator-stderr.txt" >&2
          if [ "$status" -eq 2 ]; then
            tail -n 1 "$results/evaluator-stderr.txt" > "$results/refused.txt"
          fi
          rm -f "$results/evaluator-stderr.txt"
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ inputs.artifact-prefix }}evaluator-results-livingproof-run-integrity-${{ matrix.configuration }}
          path: evaluator-results/
          retention-days: 30
          if-no-files-found: error
