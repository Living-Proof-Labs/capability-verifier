# SPDX-License-Identifier: Apache-2.0
# Reusable scenario verification for one robot repository.
# walk-hallway.yml is the wrapper existing callers use; this file is the run.
#   check (lint, profiles, robot tests) | plan (lock -> matrix, repin --check) -> evidence
#   (livingproof_sim_mujoco.evidence on the robot's adapter) ->
#   verify (this verifier at the lock's commit; grades and writes the bundle) and, in parallel,
#   scenario-evaluator (its own result files, one artifact) ->
#   media (MCAP for every trial, video for the first PASS and FAIL trial, named artifacts and
#   their URLs) -> report (collects this configuration's evaluator-results onto the bundle,
#   copies each cited thresholds.json into the uploaded report after checking its sha256,
#   then the reporter image renders the bundle 1.1.0 decisions;
#   it never grades; with the run and artifact links) ->
#   comment (reporter image `comment`).
# Every ref comes from one verification lock, including the scenario and the world.
# When the caller passes verification-lock (a livingproof-verification-lock/0.2.0 path in the
# caller repository), that lock is the only source even if the robot commit also has
# verification.lock.json: the verifier checkout, verifier image and digest, scenario-evaluator
# pin, reporter, plan, world, configuration and evidence. The job logs EVIDENCE_SOURCE: caller
# and the sha256 of the robot file it replaced, or that the robot commit has no lock. When the
# input is empty and the robot commit has verification.lock.json, that file stays the only
# source (the v1.18.0 path). Nothing is pinned in this file.
# Optional inputs verifier-commit, verifier-image, reporter-image and evaluator-commit
# supply a commit or image ref the caller resolved from a release tag. Empty leaves
# the lock field unchanged. A set input replaces that field after a strict check.
# If the lock field is present and different, the plan fails: the lock is stale.
# A capability FAIL is the result, not a CI failure. Evidence exit 4 means
# livingproof-sim-mujoco wrote the manifest and identical trials disagreed. That step
# continues only when the manifest records a test-system reproducibility finding.
# Verify prints the summary, then this workflow exits 4 when that finding is present,
# including when the locked verifier itself returns 0. Any other non-zero evidence
# exit fails that job, so verify does not run. One call = one robot lock, so a
# cross-robot compare fans out by calling walk-hallway.yml once per robot repository
# and merging the verified-* bundles it uploads.
#
# Robot repository contract: pins.json, tests/, and a pyproject.toml with the runner source
# and `[tool.livingproof] adapter = "<module>:<object>"` (a livingproof_sim_mujoco.evidence
# Robot adapter). verification.lock.json stays on commits that still publish it. CI needs
# no robot Taskfile targets.
#
#   jobs:
#     verify:
#       uses: Living-Proof-Labs/capability-verifier/.github/workflows/walk-hallway.yml@<commit>
#       permissions: {contents: read, pull-requests: write}
name: scenario
on:
  workflow_call:
    inputs:
      repository:
        description: Robot repository to verify (default the caller)
        type: string
        default: ''
      ref:
        description: Robot repository ref (default the caller's ref)
        type: string
        default: ''
      configurations:
        description: JSON list of configuration names to run (default every one in the lock)
        type: string
        default: ''
      verification-lock:
        description: >-
          Path in the caller repository of a livingproof-verification-lock/0.2.0.
          When set, this lock is the only source for the run, even if the robot
          commit has verification.lock.json. The workflow writes the document
          livingproof-sim-mujoco evidence reads, points repin --check
          at this lock, and records the replaced robot lock's sha256. Empty
          leaves a robot verification.lock.json as the only source.
          PENDING_RELEASE in a caller lock still fails.
        type: string
        default: ''
      verifier-commit:
        description: >-
          Optional releases.verifier.commit resolved from the release tag
          (40 lowercase hexadecimal characters). Empty keeps the lock. When the
          lock commit is present and different, the plan fails.
        type: string
        default: ''
      verifier-image:
        description: >-
          Optional verifier image ref resolved from the release tag:
          ghcr.io/living-proof-labs/capability-verifier-hallway:<semver>@sha256:<64 hex>.
          Empty keeps the lock. When the lock ref is present and different, the plan fails.
        type: string
        default: ''
      reporter-image:
        description: >-
          Optional reporter image ref resolved from the release tag:
          ghcr.io/living-proof-labs/livingproof-capability-report image, tag <semver>, digest sha256:<64 hex>.
          Empty keeps the lock. When the lock ref is present and different, the plan fails.
        type: string
        default: ''
      evaluator-commit:
        description: >-
          Optional evaluators.livingproof-evaluator-scenario.commit resolved from
          the release tag (40 lowercase hexadecimal characters). Empty keeps the
          lock. When the lock commit is present and different, the plan fails.
        type: string
        default: ''
      artifact-prefix:
        description: Prefix for artifact names, unique per call when fanning out
        type: string
        default: ''
      comment:
        description: Post or update the PR comment (same-repository pull requests only)
        type: boolean
        default: true
      check:
        description: Run lint, profile validation and the robot repository's tests
        type: boolean
        default: true
      media:
        description: >-
          Record MCAP for every trial and video for the first PASS and FAIL trial
          (livingproof_sim_mujoco.media, runner >= 1.6.0 with the `media` extra; reporter >= 1.11.0).
          Media 1.0.0 names that trial by seed; media 2.0.0 names it by index.
        type: boolean
        default: true
    outputs:
      configurations:
        description: JSON list of the configurations that ran
        value: ${{ jobs.plan.outputs.configurations }}
      report-artifacts:
        description: Download pattern for the per-configuration capability reports
        value: ${{ inputs.artifact-prefix }}capability-report-*
permissions:
  contents: read
jobs:
  check:
    if: inputs.check
    runs-on: ubuntu-24.04
    env:
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libosmesa6
      - run: python3 -m pip install --user uv==0.13.6
      - name: Setup (locked environment, pinned upstream files)
        run: |
          uv sync --locked
          uv run --no-sync python -c "from pathlib import Path; from livingproof_sim_mujoco import pins; print(len(pins.fetch(Path('.'))), 'pinned files verified')"
      - name: Robot adapter from pyproject.toml
        id: adapter
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          print("ref=" + tomllib.load(open("pyproject.toml", "rb"))["tool"]["livingproof"]["adapter"])
          PY
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - name: Robot and configuration profiles valid
        env:
          ADAPTER: ${{ steps.adapter.outputs.ref }}
        run: |
          uv run --no-sync python - <<'PY'
          import importlib, os
          module, name = os.environ["ADAPTER"].split(":")
          robot = getattr(importlib.import_module(module), name)
          names = [c["name"] for c in robot.robot()["configurations"]]
          for n in names:
              robot.configuration(n)
          print("profiles valid:", ", ".join(names))
          PY
      - run: mkdir -p artifacts && uv run --no-sync pytest tests --junitxml=artifacts/tests.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: ${{ inputs.artifact-prefix }}tests
          path: artifacts/tests.xml
          retention-days: 14
  plan:
    runs-on: ubuntu-24.04
    outputs:
      configurations: ${{ steps.lock.outputs.configurations }}
      verifier-repository: ${{ steps.lock.outputs.verifier-repository }}
      verifier-commit: ${{ steps.lock.outputs.verifier-commit }}
      verifier-version: ${{ steps.lock.outputs.verifier-version }}
      reporter-image: ${{ steps.lock.outputs.reporter-image }}
      verifier-image: ${{ steps.lock.outputs.verifier-image }}
      evaluator-repository: ${{ steps.lock.outputs.evaluator-repository }}
      evaluator-commit: ${{ steps.lock.outputs.evaluator-commit }}
      evaluator-tag: ${{ steps.lock.outputs.evaluator-tag }}
      verifier-commit-source: ${{ steps.lock.outputs.verifier-commit-source }}
      verifier-image-source: ${{ steps.lock.outputs.verifier-image-source }}
      reporter-image-source: ${{ steps.lock.outputs.reporter-image-source }}
      evaluator-commit-source: ${{ steps.lock.outputs.evaluator-commit-source }}
      # Tag-only pin for livingproof-evaluator-run (no commit).
      run-integrity-repository: ${{ steps.lock.outputs.run-integrity-repository }}
      run-integrity-tag: ${{ steps.lock.outputs.run-integrity-tag }}
      media-capable: ${{ steps.capability.outputs.media-capable }}
      bundle-version: ${{ steps.capability.outputs.bundle-version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          path: robot
          persist-credentials: false
      - name: Robot verification lock
        id: robot-lock
        run: |
          if [ -f robot/verification.lock.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "source=robot" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Workflow source
        if: ${{ inputs.verification-lock != '' || steps.robot-lock.outputs.present == 'false' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: workflow-src
          persist-credentials: false
      - name: Caller repository
        if: ${{ inputs.verification-lock != '' || steps.robot-lock.outputs.present == 'false' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: caller
          persist-credentials: false
      - name: Write evidence inputs for livingproof-sim-mujoco
        id: evidence-inputs
        if: ${{ inputs.verification-lock != '' || steps.robot-lock.outputs.present == 'false' }}
        env:
          VERIFICATION_LOCK: ${{ inputs.verification-lock }}
          COPY_CALLER_LOCK: "1"
        run: |
          sh workflow-src/.github/scripts/write_evidence_inputs.sh robot caller "$VERIFICATION_LOCK" workflow-src >> "$GITHUB_OUTPUT"
          # Keep workflow-src: the evaluator pin check below imports this
          # workflow's code, not the locked verifier, which may be older.
          rm -rf caller
      - id: resolved-pin-source
        env:
          # actionlint's job type omits workflow_repository and workflow_sha.
          JOB_JSON: ${{ toJson(job) }}
        run: |
          set -euo pipefail
          repository="$(jq -r .workflow_repository <<<"$JOB_JSON")"
          sha="$(jq -r .workflow_sha <<<"$JOB_JSON")"
          test -n "$repository"
          test "$repository" != null
          test -n "$sha"
          test "$sha" != null
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Resolved pin script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ steps.resolved-pin-source.outputs.repository }}
          ref: ${{ steps.resolved-pin-source.outputs.sha }}
          path: resolved-pin-src
          persist-credentials: false
      - name: Refs from verification.lock.json
        id: lock
        working-directory: robot
        env:
          ONLY: ${{ inputs.configurations }}
          EVIDENCE_SOURCE: ${{ steps.evidence-inputs.outputs.source || steps.robot-lock.outputs.source }}
          RESOLVED_VERIFIER_COMMIT: ${{ inputs.verifier-commit }}
          RESOLVED_VERIFIER_IMAGE: ${{ inputs.verifier-image }}
          RESOLVED_REPORTER_IMAGE: ${{ inputs.reporter-image }}
          RESOLVED_EVALUATOR_COMMIT: ${{ inputs.evaluator-commit }}
        run: |
          # Evaluator pins live on the selected lock. The caller copy keeps the 0.2.0
          # evaluators field. A caller-verification.lock.json committed in the robot
          # repository is not a verification-lock input. Refuse it before jq: the
          # verifier runtime that replays this step does not install jq.
          pin=verification.lock.json
          if [ -f caller-verification.lock.json ]; then
            if [ "${EVIDENCE_SOURCE:-}" != "caller" ]; then
              echo "caller-verification.lock.json is committed in the robot repository; pass verification-lock or remove that file" >&2
              exit 1
            fi
            pin=caller-verification.lock.json
          fi
          all=$(jq -c '[.configurations[].name]' verification.lock.json)
          if [ -n "$ONLY" ]; then
            configurations=$(jq -cn --argjson all "$all" --argjson only "$ONLY" \
              'if ($only - $all) == [] then $only else error("not in the lock: \($only - $all)") end')
          else
            configurations=$all
          fi
          echo "scenario: $(jq -r '.scenario // empty' verification.lock.json)"
          echo "world: $(jq -r '.world.id // empty' verification.lock.json)"
          # Resolved pins are decided by apply_resolved_pins.sh (real jq). Empty inputs
          # keep the lock. A set input fills an empty field and is written into the lock
          # before capability and repin. A commit that is not the tag's commit, or an
          # image semver that is not the lock tag, fails here.
          apply=${RESOLVED_PINS_SCRIPT:-}
          if [ -z "$apply" ] && [ -n "${GITHUB_WORKSPACE:-}" ]; then
            apply=$GITHUB_WORKSPACE/resolved-pin-src/.github/scripts/apply_resolved_pins.sh
          fi
          if [ -z "$apply" ] || [ ! -f "$apply" ]; then
            echo "apply_resolved_pins.sh is not available" >&2
            exit 1
          fi
          resolved_out=$(mktemp)
          RESOLVED_PIN_FILE=$pin bash "$apply" > "$resolved_out"
          verifier_commit=
          verifier_image=
          reporter_image=
          evaluator_commit=
          verifier_commit_source=
          verifier_image_source=
          reporter_image_source=
          evaluator_commit_source=
          while IFS= read -r line; do
            case $line in
              verifier-commit=*) verifier_commit=${line#verifier-commit=} ;;
              verifier-image=*) verifier_image=${line#verifier-image=} ;;
              reporter-image=*) reporter_image=${line#reporter-image=} ;;
              evaluator-commit=*) evaluator_commit=${line#evaluator-commit=} ;;
              verifier-commit-source=*) verifier_commit_source=${line#verifier-commit-source=} ;;
              verifier-image-source=*) verifier_image_source=${line#verifier-image-source=} ;;
              reporter-image-source=*) reporter_image_source=${line#reporter-image-source=} ;;
              evaluator-commit-source=*) evaluator_commit_source=${line#evaluator-commit-source=} ;;
            esac
          done < "$resolved_out"
          rm -f "$resolved_out"
          echo "pin source verifier-commit=$verifier_commit_source"
          echo "pin source verifier-image=$verifier_image_source"
          echo "pin source reporter-image=$reporter_image_source"
          echo "pin source evaluator-commit=$evaluator_commit_source"
          {
            echo "configurations=$configurations"
            echo "verifier-repository=$(jq -r '.releases.verifier.repository' verification.lock.json)"
            echo "verifier-commit=$verifier_commit"
            echo "verifier-version=$(jq -r '.releases.verifier.tag | ltrimstr("v")' verification.lock.json)"
            echo "verifier-image=$verifier_image"
            echo "reporter-image=$reporter_image"
            echo "evaluator-repository=$(jq -r '(.evaluators // {})["livingproof-evaluator-scenario"].repository // empty' "$pin")"
            echo "evaluator-commit=$evaluator_commit"
            echo "evaluator-tag=$(jq -r '(.evaluators // {})["livingproof-evaluator-scenario"].tag // empty' "$pin")"
            echo "verifier-commit-source=$verifier_commit_source"
            echo "verifier-image-source=$verifier_image_source"
            echo "reporter-image-source=$reporter_image_source"
            echo "evaluator-commit-source=$evaluator_commit_source"
            # Tag-only pin. Default livingproof-evaluator-run v1.5.0 so
            # the run-integrity job runs when the lock omits the pin.
            repo=$(jq -r '(.evaluators // {})["livingproof-evaluator-run"].repository // empty' "$pin")
            tag=$(jq -r '(.evaluators // {})["livingproof-evaluator-run"].tag // empty' "$pin")
            [ -n "$repo" ] || repo="Living-Proof-Labs/livingproof-evaluator-run"
            [ -n "$tag" ] || tag="v1.5.0"
            echo "run-integrity-repository=$repo"
            echo "run-integrity-tag=$tag"
          } >> "$GITHUB_OUTPUT"
      - name: Media and bundle capability from the locks
        # Media needs runner >= 1.6.0 with mcap and reporter >= 1.11.0; robots still on runner
        # 1.5.0 / reporter 1.10.0 skip media instead of failing it. Bundle 1.1.0 (the verifier's
        # own decisions, rendered by the reporter, never regraded) needs verifier >= 1.9.0 and
        # reporter >= 2.0.0. Older locks (bundle 1.0.0, graded by the reporter, whose grade is
        # gone from 3.0.0) fail here: call walk-hallway.yml at v1.10.0 or earlier for them.
        # Versions compare by PEP 440; a pre-release or dev tag never counts as the release.
        id: capability
        working-directory: robot
        run: |
          python3 -m pip install --user packaging==26.3
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys, tomllib
          from packaging.version import InvalidVersion, Version
          def at_least(what, text, minimum):
              # PEP 440. Fails closed: a pre-release, dev release or unparsable version is
              # never the final release it precedes (1.7.0rc1 and 2.0.0.dev1 are not >= x.y.0).
              try:
                  version = Version(text)
              except InvalidVersion:
                  print(f"::warning::{what} {text!r} is not a PEP 440 version; treated as below {minimum}", file=sys.stderr)
                  return False
              if version.is_prerelease or version.is_devrelease:
                  print(f"::warning::{what} {text} is a pre-release or dev release; treated as below {minimum}", file=sys.stderr)
                  return False
              return version >= Version(minimum)
          # A robot's own editable package has no version in uv.lock (setuptools-scm).
          packages = {p["name"]: p.get("version", "0") for p in tomllib.load(open("uv.lock", "rb"))["package"]}
          releases = json.load(open("verification.lock.json"))["releases"]
          reporter, verifier = releases["reporter"]["tag"], releases["verifier"]["tag"]
          runner = packages.get("livingproof-sim-mujoco", "0")
          capable = (
              at_least("runner livingproof-sim-mujoco", runner, "1.6.0")
              and "mcap" in packages
              and at_least("reporter", reporter, "1.11.0")
          )
          print(f"media-capable={str(capable).lower()}")
          if not (at_least("verifier", verifier, "1.9.0") and at_least("reporter", reporter, "2.0.0")):
              sys.exit(
                  f"::error::verifier {verifier} / reporter {reporter}: this workflow needs verifier "
                  ">= 1.9.0 and reporter >= 2.0.0 (bundle 1.1.0). Repin the lock, or call "
                  "walk-hallway.yml at v1.10.0 or earlier, which still grades bundle 1.0.0."
              )
          print("bundle-version=1.1.0")
          PY
      - name: Capability verifier at the locked release (for repin)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ steps.lock.outputs.verifier-repository }}
          ref: ${{ steps.lock.outputs.verifier-commit }}
          path: verifier
          persist-credentials: false
      - name: Every ref is a released tag
        env:
          EVIDENCE_SOURCE: ${{ steps.evidence-inputs.outputs.source || steps.robot-lock.outputs.source }}
          EVALUATOR_REPOSITORY: ${{ steps.lock.outputs.evaluator-repository }}
          EVALUATOR_COMMIT: ${{ steps.lock.outputs.evaluator-commit }}
          EVALUATOR_TAG: ${{ steps.lock.outputs.evaluator-tag }}
        run: |
          if [ "$EVIDENCE_SOURCE" = "caller" ]; then
            python3 verifier/src/capability_verifier/repin.py --root robot --lock caller-verification.lock.json --check
          else
            python3 verifier/src/capability_verifier/repin.py --root robot --check
          fi
          if [ -n "${EVALUATOR_COMMIT:-}" ]; then
            if [ -d workflow-src/src ]; then
              pin_src=workflow-src/src
            else
              pin_src=verifier/src
            fi
            PYTHONPATH="$pin_src" python3 -m capability_verifier.evaluator_pin \
              --repository "$EVALUATOR_REPOSITORY" \
              --tag "$EVALUATOR_TAG" \
              --commit "$EVALUATOR_COMMIT" \
              --verifier verifier
          fi
  evidence:
    needs: plan
    runs-on: ubuntu-24.04
    container:
      # The verifier image from the lock (releases.verifier.image:tag@digest): osmesa, uv and
      # the locked dependencies pre-synced. A lock without it runs on the runner (empty image).
      image: ${{ needs.plan.outputs.verifier-image }}
      # The image's user is lpl (uid 1000), but actions/checkout, upload-artifact and
      # download-artifact write the runner-owned workspace (/__w, uid 1001), so run as root.
      options: --user root
    # A container job's default shell is sh. resolved-pin-source uses bash, and the image has it.
    defaults:
      run:
        shell: bash
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        configuration: ${{ fromJSON(needs.plan.outputs.configurations) }}
    env:
      CONFIGURATION: ${{ matrix.configuration }}
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Robot verification lock
        id: robot-lock
        run: |
          if [ -f verification.lock.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "source=robot" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Workflow source
        if: ${{ inputs.verification-lock != '' || steps.robot-lock.outputs.present == 'false' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: workflow-src
          persist-credentials: false
      - name: Caller repository
        if: ${{ inputs.verification-lock != '' || steps.robot-lock.outputs.present == 'false' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: caller
          persist-credentials: false
      - name: Write evidence inputs for livingproof-sim-mujoco
        if: ${{ inputs.verification-lock != '' || steps.robot-lock.outputs.present == 'false' }}
        env:
          VERIFICATION_LOCK: ${{ inputs.verification-lock }}
        run: |
          sh workflow-src/.github/scripts/write_evidence_inputs.sh . caller "$VERIFICATION_LOCK" workflow-src >> "$GITHUB_OUTPUT"
          rm -rf caller workflow-src
      - id: resolved-pin-source
        env:
          # actionlint's job type omits workflow_repository and workflow_sha.
          JOB_JSON: ${{ toJson(job) }}
        run: |
          set -euo pipefail
          repository="$(jq -r .workflow_repository <<<"$JOB_JSON")"
          sha="$(jq -r .workflow_sha <<<"$JOB_JSON")"
          test -n "$repository"
          test "$repository" != null
          test -n "$sha"
          test "$sha" != null
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Resolved pin script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ steps.resolved-pin-source.outputs.repository }}
          ref: ${{ steps.resolved-pin-source.outputs.sha }}
          path: resolved-pin-src
          persist-credentials: false
      - name: Record resolved pins in the evidence lock
        env:
          PYTHONPATH: ${{ github.workspace }}/resolved-pin-src/src
          VERIFIER_COMMIT: ${{ needs.plan.outputs.verifier-commit }}
          VERIFIER_COMMIT_SOURCE: ${{ needs.plan.outputs.verifier-commit-source }}
          VERIFIER_IMAGE: ${{ needs.plan.outputs.verifier-image }}
          VERIFIER_IMAGE_SOURCE: ${{ needs.plan.outputs.verifier-image-source }}
          REPORTER_IMAGE: ${{ needs.plan.outputs.reporter-image }}
          REPORTER_IMAGE_SOURCE: ${{ needs.plan.outputs.reporter-image-source }}
          EVALUATOR_COMMIT: ${{ needs.plan.outputs.evaluator-commit }}
          EVALUATOR_COMMIT_SOURCE: ${{ needs.plan.outputs.evaluator-commit-source }}
        run: python3 -m capability_verifier.resolved_pins --record verification.lock.json
      - name: Workflow source for the verifier image record
        # The recording script comes from the commit of this workflow, not from the image
        # under test, so an older locked image cannot lack it or change it.
        if: ${{ needs.plan.outputs.verifier-image != '' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: image-record-src
          sparse-checkout: .github/scripts
          persist-credentials: false
      - if: needs.plan.outputs.verifier-image == ''
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libosmesa6
      - if: needs.plan.outputs.verifier-image == ''
        run: python3 -m pip install --user uv==0.13.6
      - name: Setup (locked environment, pinned upstream files)
        run: |
          uv sync --locked
          uv run --no-sync python -c "from pathlib import Path; from livingproof_sim_mujoco import pins; print(len(pins.fetch(Path('.'))), 'pinned files verified')"
      - name: Robot adapter from pyproject.toml
        id: adapter
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          print("ref=" + tomllib.load(open("pyproject.toml", "rb"))["tool"]["livingproof"]["adapter"])
          PY
      - name: Evidence (observations only, no grade)
        id: evidence
        # Exit 4 continues only when the manifest records a test-system finding.
        # Any other non-zero exit, including exit 4 without that finding, fails the step.
        # The exit code is also written to a temp file that "Evidence ending" turns into
        # evidence-ending.json. A step whose own shell is killed writes nothing.
        env:
          ADAPTER: ${{ steps.adapter.outputs.ref }}
        # livingproof-sim-mujoco >= 3.0 requires --lock: it gets the evidence document the
        # plan wrote (verification.lock.json here). Robots on sim v2.x read that file
        # themselves and keep the same command as before.
        run: |
          rm -f "${RUNNER_TEMP:-/tmp}/evidence-ending.json"
          set --
          if python3 - <<'PY'
          import sys, tomllib
          packages = {p["name"]: p.get("version", "0") for p in tomllib.load(open("uv.lock", "rb"))["package"]}
          major = packages.get("livingproof-sim-mujoco", "0").split(".")[0]
          sys.exit(0 if major.isdigit() and int(major) >= 3 else 1)
          PY
          then
            set -- --lock verification.lock.json
          fi
          set +e
          uv run --no-sync python -m livingproof_sim_mujoco.evidence "$ADAPTER" "$CONFIGURATION" "artifacts/evidence/$CONFIGURATION" "$@"
          code=$?
          set -e
          # 128+N is how a shell reports a process killed by signal N (137 KILL, 143 TERM).
          signal=
          if [ "$code" -gt 128 ]; then
            signal=$(kill -l "$((code - 128))" 2>/dev/null | tr -cd 'A-Z0-9' || true)
          fi
          if [ -n "$signal" ]; then
            printf '{"ended": "signalled", "exit_code": %s, "signal": "%s"}\n' "$code" "$signal" > "${RUNNER_TEMP:-/tmp}/evidence-ending.json"
          else
            printf '{"ended": "exited", "exit_code": %s, "signal": null}\n' "$code" > "${RUNNER_TEMP:-/tmp}/evidence-ending.json"
          fi
          if [ -n "${GITHUB_OUTPUT:-}" ]; then
            echo "evidence-exit=$code" >> "$GITHUB_OUTPUT"
          fi
          if [ "$code" -eq 0 ]; then
            exit 0
          fi
          if [ "$code" -eq 4 ]; then
            if python3 - "artifacts/evidence/$CONFIGURATION/manifest.json" <<'PY'
          import json, sys
          try:
              doc = json.load(open(sys.argv[1]))
          except (OSError, ValueError):
              sys.exit(1)
          trials = doc.get("trials") if isinstance(doc, dict) else None
          record = trials.get("reproducibility") if isinstance(trials, dict) else None
          finding = record.get("finding") if isinstance(record, dict) else None
          sys.exit(0 if isinstance(finding, dict) and finding.get("kind") == "test-system" else 1)
          PY
            then
              echo "evidence exit 4: trials disagreed; the manifest carries a test-system finding; continuing to verify" >&2
              exit 0
            fi
            echo "evidence exit 4 without a test-system reproducibility finding; verify will not run" >&2
            exit 4
          fi
          echo "evidence failed (exit $code); verify will not run" >&2
          exit "$code"
      - name: Evidence ending, recorded in the artifact
        # Runs after success, failure, cancellation and a job timeout (checked on a hosted
        # runner in a container job: the step after a cancelled or timed-out step runs, and
        # the artifact upload after it works). It does not run when the runner or its VM
        # disappears. evidence-ending.json (livingproof-evidence-ending/0.1) says how the
        # evidence step ended, for the Run Integrity job, which runs even when it did not
        # finish and may find no manifest.json.
        if: ${{ always() }}
        env:
          STEP_OUTCOME: ${{ steps.evidence.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          raw = pathlib.Path(os.environ.get("RUNNER_TEMP", "/tmp")) / "evidence-ending.json"
          # The evidence step never reached its end: no exit code was seen.
          ending = {"ended": "unfinished", "exit_code": None, "signal": None}
          try:
              text = raw.read_text()
          except OSError:
              text = None
          if text is not None:
              try:
                  found = json.loads(text)
              except ValueError:
                  found = None
              ok = (
                  isinstance(found, dict)
                  and "signal" in found
                  and isinstance(found.get("exit_code"), int)
                  and not isinstance(found.get("exit_code"), bool)
                  and (
                      (found.get("ended") == "exited" and found.get("signal") is None)
                      or (found.get("ended") == "signalled" and isinstance(found.get("signal"), str))
                  )
              )
              if ok:
                  ending = found
              else:
                  # Partial or wrong-shaped: it cannot be trusted, and the record has no room
                  # for it, so the log keeps what was there.
                  print("evidence-ending.json from the evidence step is not usable; recording unfinished. It held:", text.strip()[:200])
          configuration = os.environ["CONFIGURATION"]
          directory = pathlib.Path("artifacts/evidence") / configuration
          planned = None
          try:
              count = json.load(open("verification.lock.json"))["plan"]["trials"]["count"]
              planned = count if isinstance(count, int) and not isinstance(count, bool) and count >= 0 else None
          except (OSError, ValueError, KeyError, TypeError):
              pass
          directory.mkdir(parents=True, exist_ok=True)
          record = {
              "format": "livingproof-evidence-ending/0.1",
              "configuration": configuration,
              "ended": ending["ended"],
              "exit_code": ending["exit_code"],
              "signal": ending["signal"],
              "step_outcome": os.environ.get("STEP_OUTCOME") or None,
              "manifest_present": (directory / "manifest.json").is_file(),
              "planned_trials": planned,
          }
          (directory / "evidence-ending.json").write_text(json.dumps(record, indent=2) + "\n")
          print("Evidence ending:", json.dumps(record))
          # Removed only now, so a failure before the record is written leaves it to read.
          raw.unlink(missing_ok=True)
          PY

      - name: Verifier image this job ran in, from the container engine
        # The lock's image:tag@digest is what this job was asked to run. The record keeps the
        # digest the engine reports for the image under this container beside it, in the
        # evidence artifact that Run Integrity downloads (verifier-image.json,
        # livingproof-verifier-image/0.1). A difference or an unreachable engine is recorded,
        # not fatal: the pins check reports it.
        if: ${{ always() && needs.plan.outputs.verifier-image != '' }}
        env:
          LOCKED_IMAGE: ${{ needs.plan.outputs.verifier-image }}
          CONTAINER_ID: ${{ job.container.id }}
        run: |
          python3 image-record-src/.github/scripts/record_verifier_image.py \
            --locked "$LOCKED_IMAGE" --container "$CONTAINER_ID" \
            --out "artifacts/evidence/$CONFIGURATION/verifier-image.json"
          rm -rf image-record-src
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ inputs.artifact-prefix }}evidence-${{ matrix.configuration }}
          path: artifacts/evidence/${{ matrix.configuration }}/
          retention-days: 30
          if-no-files-found: error
  verify:
    needs: [plan, evidence]
    runs-on: ubuntu-24.04
    container:
      # The verifier image from the lock (releases.verifier.image:tag@digest): osmesa, uv and
      # the locked dependencies pre-synced. A lock without it runs on the runner (empty image).
      image: ${{ needs.plan.outputs.verifier-image }}
      # The image's user is lpl (uid 1000), but actions/checkout, upload-artifact and
      # download-artifact write the runner-owned workspace (/__w, uid 1001), so run as root.
      options: --user root
    env:
      LIVINGPROOF_VERIFIER_VERSION: ${{ needs.plan.outputs.verifier-version }}
    strategy:
      fail-fast: false
      matrix:
        configuration: ${{ fromJSON(needs.plan.outputs.configurations) }}
    steps:
      - name: Capability verifier at the locked release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ needs.plan.outputs.verifier-repository }}
          ref: ${{ needs.plan.outputs.verifier-commit }}
          persist-credentials: false
      - if: needs.plan.outputs.verifier-image == ''
        run: python3 -m pip install --user uv==0.13.6
      - run: uv sync --locked
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.artifact-prefix }}evidence-${{ matrix.configuration }}
          path: evidence
      - name: Scenario catalog from the declared lock
        run: uv run --no-sync python tools/fetch_hallway_specs.py --from evidence/manifest.json
      - name: Assess every trial (bundle 1.1.0 also carries the verifier's decisions)
        # The locked verifier writes the summary. This step then exits 4 when the
        # manifest carries a test-system finding, including when that verifier returns 0.
        # A non-zero verifier exit is kept. The upload below keeps the written record.
        env:
          BUNDLE_VERSION: ${{ needs.plan.outputs.bundle-version }}
        run: |
          set +e
          PYTHONPATH=src uv run --no-sync python tools/verify_hallway.py --declared --bundle-version "$BUNDLE_VERSION" evidence/manifest.json verified
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
          if python3 - evidence/manifest.json <<'PY'
          import json, sys
          try:
              doc = json.load(open(sys.argv[1]))
          except (OSError, ValueError):
              sys.exit(1)
          trials = doc.get("trials") if isinstance(doc, dict) else None
          record = trials.get("reproducibility") if isinstance(trials, dict) else None
          finding = record.get("finding") if isinstance(record, dict) else None
          sys.exit(0 if isinstance(finding, dict) and finding.get("kind") == "test-system" else 1)
          PY
          then
            echo "test-system reproducibility finding is on the record; exiting 4" >&2
            exit 4
          fi
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ inputs.artifact-prefix }}verified-${{ matrix.configuration }}
          path: verified/
          retention-days: 30
          if-no-files-found: error
  scenario-evaluator:
    # Parallel with verify. Writes only this evaluator's result files.
    needs: [plan, evidence]
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.plan.outputs.verifier-image }}
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        configuration: ${{ fromJSON(needs.plan.outputs.configurations) }}
    steps:
      - name: Capability verifier at the locked release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ needs.plan.outputs.verifier-repository }}
          ref: ${{ needs.plan.outputs.verifier-commit }}
          persist-credentials: false
      - if: needs.plan.outputs.verifier-image == ''
        run: python3 -m pip install --user uv==0.13.6
      - run: uv sync --locked
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.artifact-prefix }}evidence-${{ matrix.configuration }}
          path: evidence
      - name: Scenario catalog from the declared lock
        run: uv run --no-sync python tools/fetch_hallway_specs.py --from evidence/manifest.json
      - name: Scenario evaluator package at the locked pin
        if: needs.plan.outputs.evaluator-commit != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ needs.plan.outputs.evaluator-repository }}
          ref: ${{ needs.plan.outputs.evaluator-commit }}
          path: evaluator
          persist-credentials: false
      - name: Workflow source for the evaluator pin
        if: needs.plan.outputs.evaluator-commit != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: workflow-src
          persist-credentials: false
      - name: Scenario evaluator, one result file per trial
        env:
          EVALUATOR_REPOSITORY: ${{ needs.plan.outputs.evaluator-repository }}
          EVALUATOR_COMMIT: ${{ needs.plan.outputs.evaluator-commit }}
          EVALUATOR_TAG: ${{ needs.plan.outputs.evaluator-tag }}
        run: |
          # The tool is the one in the verifier checkout named by the selected lock.
          # The package import is that lock's evaluator pin when it has one; a robot
          # lock with no evaluators field keeps the package from that verifier checkout.
          # evaluator/src is imported ahead of either environment's installed copy, and
          # the checkout's own dependencies are installed before that import.
          if [ -n "$EVALUATOR_COMMIT" ]; then
            if [ -d workflow-src/src ]; then
              pin_src=workflow-src/src
            else
              pin_src=src
            fi
            # actions/checkout fetched the locked commit shallow and tagless, which hatch-vcs
            # builds as 0.1.dev1. --checkout fetches the locked tag into it once it is
            # checked against the locked commit, so the build reads the release version.
            release=$(PYTHONPATH="$pin_src" python3 -m capability_verifier.evaluator_pin \
              --repository "$EVALUATOR_REPOSITORY" \
              --tag "$EVALUATOR_TAG" \
              --commit "$EVALUATOR_COMMIT" \
              --verifier . \
              --checkout evaluator)
            uv sync --locked --directory evaluator
            eval_site=$(evaluator/.venv/bin/python -c 'import site; print(next(p for p in site.getsitepackages() if p.endswith("site-packages")))')
            export PYTHONPATH="evaluator/src:${eval_site}:src"
            imported=$(uv run --no-sync python -c 'import livingproof_evaluator_scenario as package; print(package.__file__)')
            case "$imported" in
              */evaluator/src/livingproof_evaluator_scenario/*) ;;
              *)
                echo "livingproof_evaluator_scenario imported from ${imported}, not evaluator/src" >&2
                exit 1
                ;;
            esac
            # The version the evaluator writes into each result (importlib.metadata).
            reported=$(uv run --no-sync python -c 'import importlib.metadata as m; print(m.version("livingproof-evaluator-scenario"))')
            if [ "$reported" != "$release" ]; then
              echo "livingproof-evaluator-scenario reports ${reported}, not the locked ${EVALUATOR_TAG}" >&2
              exit 1
            fi
            uv run --no-sync python tools/run_scenario_evaluator.py \
              evidence/manifest.json evaluator-results/livingproof-scenario
          else
            PYTHONPATH=src uv run --no-sync python tools/run_scenario_evaluator.py \
              evidence/manifest.json evaluator-results/livingproof-scenario
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ inputs.artifact-prefix }}evaluator-results-livingproof-scenario-${{ matrix.configuration }}
          path: evaluator-results/
          retention-days: 30
          if-no-files-found: error
  scenario-media:
    # The scenario evaluator on the run's recordings: each trial's MCAP, read through its binding.
    # Needs the media job's artifact, so it runs after media and never holds up the report. The
    # evaluator resolves every limit from the run manifest; nothing here passes one. A limit the
    # manifest cannot give leaves its step NOT_EVALUATED. The pinned evaluator must have the media
    # runner (livingproof-evaluator-scenario v1.5.0 or later); an older pin leaves a note instead.
    needs: [plan, evidence, media]
    if: ${{ !cancelled() && needs.evidence.result == 'success' && needs.plan.outputs.evaluator-commit != '' }}
    runs-on: ubuntu-24.04
    # The report waits for this job, so a hang (for example in uv sync) must not hold it for the
    # 6-hour default.
    timeout-minutes: 30
    container:
      image: ${{ needs.plan.outputs.verifier-image }}
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        configuration: ${{ fromJSON(needs.plan.outputs.configurations) }}
    steps:
      - name: Capability verifier at the locked release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ needs.plan.outputs.verifier-repository }}
          ref: ${{ needs.plan.outputs.verifier-commit }}
          persist-credentials: false
      - if: needs.plan.outputs.verifier-image == ''
        run: python3 -m pip install --user uv==0.13.6
      - run: uv sync --locked
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.artifact-prefix }}evidence-${{ matrix.configuration }}
          path: evidence
      - name: Download the media job's artifact
        # As in run-integrity: a missing artifact after a successful media job fails the download.
        if: ${{ needs.media.result != 'skipped' }}
        continue-on-error: ${{ needs.media.result != 'success' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.artifact-prefix }}mcap-${{ matrix.configuration }}
          path: media
      - name: Scenario catalog from the declared lock
        run: uv run --no-sync python tools/fetch_hallway_specs.py --from evidence/manifest.json
      - name: Scenario evaluator package at the locked pin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ needs.plan.outputs.evaluator-repository }}
          ref: ${{ needs.plan.outputs.evaluator-commit }}
          path: evaluator
          persist-credentials: false
      - name: Workflow source for the evaluator pin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: workflow-src
          persist-credentials: false
      - name: Scenario evaluator on the recordings
        env:
          EVALUATOR_REPOSITORY: ${{ needs.plan.outputs.evaluator-repository }}
          EVALUATOR_COMMIT: ${{ needs.plan.outputs.evaluator-commit }}
          EVALUATOR_TAG: ${{ needs.plan.outputs.evaluator-tag }}
        run: |
          mkdir -p media
          if [ -d workflow-src/src ]; then
            pin_src=workflow-src/src
          else
            pin_src=src
          fi
          # actions/checkout fetched the locked commit shallow and tagless, which hatch-vcs
          # builds as 0.1.dev1. --checkout fetches the locked tag into it once it is
          # checked against the locked commit, so the build reads the release version.
          release=$(PYTHONPATH="$pin_src" python3 -m capability_verifier.evaluator_pin \
            --repository "$EVALUATOR_REPOSITORY" \
            --tag "$EVALUATOR_TAG" \
            --commit "$EVALUATOR_COMMIT" \
            --verifier . \
            --checkout evaluator)
          uv sync --locked --directory evaluator
          eval_site=$(evaluator/.venv/bin/python -c 'import site; print(next(p for p in site.getsitepackages() if p.endswith("site-packages")))')
          export PYTHONPATH="evaluator/src:${eval_site}:src"
          imported=$(uv run --no-sync python -c 'import livingproof_evaluator_scenario as package; print(package.__file__)')
          case "$imported" in
            */evaluator/src/livingproof_evaluator_scenario/*) ;;
            *)
              echo "livingproof_evaluator_scenario imported from ${imported}, not evaluator/src" >&2
              exit 1
              ;;
          esac
          # The version the evaluator writes into each result (importlib.metadata).
          reported=$(uv run --no-sync python -c 'import importlib.metadata as m; print(m.version("livingproof-evaluator-scenario"))')
          if [ "$reported" != "$release" ]; then
            echo "livingproof-evaluator-scenario reports ${reported}, not the locked ${EVALUATOR_TAG}" >&2
            exit 1
          fi
          uv run --no-sync python tools/run_scenario_media.py \
            evidence/manifest.json media evaluator-results/livingproof-scenario-media \
            --identity "git+https://github.com/${EVALUATOR_REPOSITORY}@${EVALUATOR_COMMIT}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ inputs.artifact-prefix }}evaluator-results-livingproof-scenario-media-${{ matrix.configuration }}
          path: evaluator-results/
          retention-days: 30
          if-no-files-found: ignore
  media:
    # Recordings for links, never a grade: every trial is re-run and must hash to its evidence.
    needs: [plan, verify]
    if: inputs.media && needs.plan.outputs.media-capable == 'true'
    runs-on: ubuntu-24.04
    container:
      # The verifier image from the lock (releases.verifier.image:tag@digest): osmesa, uv and
      # the locked dependencies pre-synced. A lock without it runs on the runner (empty image).
      image: ${{ needs.plan.outputs.verifier-image }}
      # The image's user is lpl (uid 1000), but actions/checkout, upload-artifact and
      # download-artifact write the runner-owned workspace (/__w, uid 1001), so run as root.
      options: --user root
    # A container job's default shell is sh. resolved-pin-source uses bash, and the image has it.
    defaults:
      run:
        shell: bash
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        configuration: ${{ fromJSON(needs.plan.outputs.configurations) }}
    env:
      CONFIGURATION: ${{ matrix.configuration }}
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
      PREFIX: ${{ inputs.artifact-prefix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Robot verification lock
        id: robot-lock
        run: |
          if [ -f verification.lock.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "source=robot" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Workflow source
        if: ${{ inputs.verification-lock != '' || steps.robot-lock.outputs.present == 'false' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: workflow-src
          persist-credentials: false
      - name: Caller repository
        if: ${{ inputs.verification-lock != '' || steps.robot-lock.outputs.present == 'false' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: caller
          persist-credentials: false
      - name: Write evidence inputs for livingproof-sim-mujoco
        if: ${{ inputs.verification-lock != '' || steps.robot-lock.outputs.present == 'false' }}
        env:
          VERIFICATION_LOCK: ${{ inputs.verification-lock }}
        run: |
          sh workflow-src/.github/scripts/write_evidence_inputs.sh . caller "$VERIFICATION_LOCK" workflow-src >> "$GITHUB_OUTPUT"
          rm -rf caller workflow-src
      - id: resolved-pin-source
        env:
          # actionlint's job type omits workflow_repository and workflow_sha.
          JOB_JSON: ${{ toJson(job) }}
        run: |
          set -euo pipefail
          repository="$(jq -r .workflow_repository <<<"$JOB_JSON")"
          sha="$(jq -r .workflow_sha <<<"$JOB_JSON")"
          test -n "$repository"
          test "$repository" != null
          test -n "$sha"
          test "$sha" != null
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Resolved pin script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ steps.resolved-pin-source.outputs.repository }}
          ref: ${{ steps.resolved-pin-source.outputs.sha }}
          path: resolved-pin-src
          persist-credentials: false
      - name: Record resolved pins in the evidence lock
        env:
          PYTHONPATH: ${{ github.workspace }}/resolved-pin-src/src
          VERIFIER_COMMIT: ${{ needs.plan.outputs.verifier-commit }}
          VERIFIER_COMMIT_SOURCE: ${{ needs.plan.outputs.verifier-commit-source }}
          VERIFIER_IMAGE: ${{ needs.plan.outputs.verifier-image }}
          VERIFIER_IMAGE_SOURCE: ${{ needs.plan.outputs.verifier-image-source }}
          REPORTER_IMAGE: ${{ needs.plan.outputs.reporter-image }}
          REPORTER_IMAGE_SOURCE: ${{ needs.plan.outputs.reporter-image-source }}
          EVALUATOR_COMMIT: ${{ needs.plan.outputs.evaluator-commit }}
          EVALUATOR_COMMIT_SOURCE: ${{ needs.plan.outputs.evaluator-commit-source }}
        run: python3 -m capability_verifier.resolved_pins --record verification.lock.json
      - if: needs.plan.outputs.verifier-image == ''
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libosmesa6
      - if: needs.plan.outputs.verifier-image == ''
        run: python3 -m pip install --user uv==0.13.6
      - name: Setup (locked environment, pinned upstream files)
        run: |
          uv sync --locked
          uv run --no-sync python -c "from pathlib import Path; from livingproof_sim_mujoco import pins; print(len(pins.fetch(Path('.'))), 'pinned files verified')"
      - name: Robot adapter from pyproject.toml
        id: adapter
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          print("ref=" + tomllib.load(open("pyproject.toml", "rb"))["tool"]["livingproof"]["adapter"])
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.artifact-prefix }}evidence-${{ matrix.configuration }}
          path: evidence
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.artifact-prefix }}verified-${{ matrix.configuration }}
          path: verified
      - name: Recordings (MCAP every trial; video for the first PASS and first FAIL trial)
        id: media
        env:
          ADAPTER: ${{ steps.adapter.outputs.ref }}
        run: |
          uv run --no-sync python -m livingproof_sim_mujoco.media "$ADAPTER" "$CONFIGURATION" evidence verified/verification.json media
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          doc = json.load(open("media/media.json"))
          fmt = doc.get("format") if isinstance(doc, dict) else None
          if fmt in (
              "livingproof-hallway-media/2.0.0",
              "livingproof-hallway-media/2.1.0",
              "livingproof-hallway-media/2.2.0",
          ):
              key = "index"
          elif fmt == "livingproof-hallway-media/1.0.0":
              key = "seed"
          else:
              sys.exit(
                  "media.json format %r is not livingproof-hallway-media/1.0.0, "
                  "livingproof-hallway-media/2.0.0, livingproof-hallway-media/2.1.0 or "
                  "livingproof-hallway-media/2.2.0" % (fmt,)
              )
          trials = doc.get("trials")
          if not isinstance(trials, list):
              sys.exit("media.json field 'trials' has the wrong type")
          if fmt in ("livingproof-hallway-media/2.1.0", "livingproof-hallway-media/2.2.0"):
              # Each trial lists its observation binding, and the file is in the media folder
              # that the artifact below uploads whole (mcap/ holds trial-NN.binding.json).
              for t in trials:
                  entry = t.get("binding") if isinstance(t, dict) else None
                  path = entry.get("path") if isinstance(entry, dict) else None
                  if not isinstance(path, str) or not path.endswith(".binding.json"):
                      sys.exit("media.json trial has no binding entry with a .binding.json path")
                  inside = os.path.realpath("media/" + path).startswith(
                      os.path.realpath("media/mcap") + os.sep
                  )
                  if (
                      not path.startswith("mcap/")
                      or ".." in path.split("/")
                      or not inside
                      or not os.path.isfile("media/" + path)
                  ):
                      sys.exit("media.json binding file %s is not in media/mcap/" % path)
          if fmt == "livingproof-hallway-media/2.2.0":
              # 2.2.0 adds the robot adapter's own recording per trial, mcap/trial-NN.robot.mcap. It
              # sits in media/mcap/, which the artifact below uploads whole, so Run Integrity gets it
              # with media.json. Only the entry and the file are checked here: bytes and sha256 are
              # the evaluator's to check against the file (media-file-mismatch).
              for t in trials:
                  entry = t.get("robot_mcap") if isinstance(t, dict) else None
                  path = entry.get("path") if isinstance(entry, dict) else None
                  if not isinstance(path, str) or not path.endswith(".robot.mcap"):
                      sys.exit("media.json 2.2.0 trial has no robot_mcap entry with a .robot.mcap path")
                  inside = os.path.realpath("media/" + path).startswith(
                      os.path.realpath("media/mcap") + os.sep
                  )
                  if (
                      not path.startswith("mcap/")
                      or ".." in path.split("/")
                      or not inside
                      or not os.path.isfile("media/" + path)
                  ):
                      sys.exit("media.json robot_mcap file %s is not in media/mcap/" % path)
          for t in trials:
              if not isinstance(t, dict) or "video" not in t:
                  continue
              if key not in t or isinstance(t[key], bool) or type(t[key]) is not int:
                  sys.exit("media.json trial video is missing an integer %s" % key)
              kind = str(t.get("status", "")).lower()
              if kind not in ("pass", "fail"):
                  sys.exit("media.json trial video status %r is not PASS or FAIL" % (t.get("status"),))
              video = t.get("video")
              if not isinstance(video, dict) or not isinstance(video.get("path"), str):
                  sys.exit("media.json trial video path is missing")
              # Output names stay pass-seed and fail-seed. The pinned reporter's link
              # schema has a seed field and no index field. For media 2.0.0 the integer
              # is the trial index.
              print(f"{kind}-seed={t[key]}")
              print(f"{kind}-path=media/{video['path']}")
          PY
      - id: mcap
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.artifact-prefix }}mcap-${{ matrix.configuration }}
          path: |
            media/mcap/
            media/media.json
          retention-days: 30
          if-no-files-found: error
      - id: video-pass
        if: steps.media.outputs.pass-path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.artifact-prefix }}video-${{ matrix.configuration }}-seed-${{ steps.media.outputs.pass-seed }}-pass
          path: ${{ steps.media.outputs.pass-path }}
          retention-days: 30
          if-no-files-found: error
      - id: video-fail
        if: steps.media.outputs.fail-path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.artifact-prefix }}video-${{ matrix.configuration }}-seed-${{ steps.media.outputs.fail-seed }}-fail
          path: ${{ steps.media.outputs.fail-path }}
          retention-days: 30
          if-no-files-found: error
      - name: Evidence links for the reporter (run URL, artifact URLs, per-trial videos)
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MCAP_URL: ${{ steps.mcap.outputs.artifact-url }}
          PASS_URL: ${{ steps.video-pass.outputs.artifact-url }}
          PASS_SEED: ${{ steps.media.outputs.pass-seed }}
          FAIL_URL: ${{ steps.video-fail.outputs.artifact-url }}
          FAIL_SEED: ${{ steps.media.outputs.fail-seed }}
        run: |
          mkdir links
          python3 - <<'PY' > links/evidence-links.json
          import json, os
          e = os.environ
          n = len(json.load(open("media/media.json"))["trials"])
          links = [{"label": f"MCAP, all {n} trials", "url": e["MCAP_URL"], "kind": "mcap"}]
          for status in ("PASS", "FAIL"):
              url, seed = e[f"{status}_URL"], e[f"{status}_SEED"]
              if url:  # no FAIL (or no PASS) trial, no video
                  # `seed` is the reporter's field name. Media 2.0.0 stores the trial index there.
                  links.append({"label": "video", "url": url, "kind": "video",
                                "seed": int(seed), "status": status})
          print(json.dumps({"run": e["RUN_URL"], "links": links}, indent=2))
          PY
          cat links/evidence-links.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.artifact-prefix }}links-${{ matrix.configuration }}
          path: links/
          retention-days: 30
          if-no-files-found: error
  report:
    # Runs without links when media is off or failed; links never change a decision.
    # scenario-evaluator must succeed: its entry is part of the stored run. run-integrity does not
    # gate it: a failed or refused one is shown as NOT RUN and the run as INCONCLUSIVE, never omitted.
    needs: [plan, verify, scenario-evaluator, scenario-media, media, run-integrity]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.scenario-evaluator.result == 'success' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        configuration: ${{ fromJSON(needs.plan.outputs.configurations) }}
    container:
      image: ${{ needs.plan.outputs.reporter-image }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.artifact-prefix }}verified-${{ matrix.configuration }}
          path: verified
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ${{ inputs.artifact-prefix }}evaluator-results-*-${{ matrix.configuration }}
          path: evaluator-results
      - name: Append each evaluator's result documents
        env:
          # Named in the failure when no result reaches this configuration's bundle.
          EVALUATOR_RESULTS_PATTERN: ${{ inputs.artifact-prefix }}evaluator-results-*-${{ matrix.configuration }}
          # A failed or refused run-integrity leaves no result; the report says so (#214).
          RUN_INTEGRITY_RESULT: ${{ needs.run-integrity.result }}
        run: |
          if [ ! -f verified/bundle/manifest.json ]; then
            exit 0
          fi
          cat > /tmp/collect_evaluator_results.py <<'COLLECT'
          # SPDX-License-Identifier: Apache-2.0
          """Append evaluator result documents onto a bundle.

          Each file whose ``format`` is ``livingproof-evaluator-result/1.*`` is appended
          whole to the trial named by ``scenario.trial_id``. Documents are not merged
          with each other. The report groups them by ``evaluator.id``.

          A result whose ``evaluator.kind`` is ``integrity`` is run-level: it is stored
          on the assessment, keyed by ``evaluator.id``. More than one integrity
          evaluator per run is kept. A failed integrity result marks each assessment
          run ``INCONCLUSIVE`` and never changes the robot grade.

          When the run-integrity job's result is given (``RUN_INTEGRITY_RESULT``) and no integrity result
          was collected, whether the job failed, was refused by the evaluator (exit 2), was cancelled or
          skipped, or succeeded and left nothing, the run is not shown as clean: ``assessment.integrity_not_run``
          records the job result and the reason, every assessment run is ``INCONCLUSIVE``, and the report
          gets a "Run Integrity: NOT RUN" line (#214).

          A result that cites ``thresholds.json`` keeps that input reference. The file
          at the cited path is copied into the report output, and its SHA-256 has to
          match the citation. A missing file, different bytes, or a different path
          fails the collection. The manifest is left unchanged when that happens.

          The command prints, per evaluator, how many documents it appended and how many it
          skipped because their trial is not in this bundle (another configuration). A
          bundle with trials that ends up with no appended document fails, naming the
          artifact pattern in ``EVALUATOR_RESULTS_PATTERN``; a bundle with no trials (a
          "not supported" run) has nothing to append.
          """

          from __future__ import annotations

          import hashlib
          import html
          import json
          import os
          import re
          import sys
          from pathlib import Path, PurePosixPath

          RESULT_FORMAT = re.compile(r"^livingproof-evaluator-result/1\.\d+\.\d+$")
          _SHA256 = re.compile(r"^[0-9a-f]{64}$")
          _THRESHOLDS_NAME = "thresholds.json"
          _MEDIA_PREFIX = "media/"  # where the scenario media job cites its thresholds.json
          PROBLEMS_FILE = "evaluator-result-problems.txt"
          INTEGRITY_FILE = "integrity-lines.txt"


          class ThresholdCitationError(ValueError):
              """The cited thresholds.json is missing, altered, or a different path."""


          class ThresholdMissingError(ThresholdCitationError):
              """The cited thresholds.json is not among the results (``relative`` is the cited path)."""

              def __init__(self, message: str, relative: str):
                  super().__init__(message)
                  self.relative = relative


          def collect(
              bundle: dict,
              directory: Path,
              report_dir: Path | None = None,
              counts: dict | None = None,
              integrity_job: str | None = None,
          ) -> dict:
              """Append this bundle's result documents. ``bundle`` is updated.

              A document whose ``scenario.trial_id`` is not one of this bundle's results
              belongs to another configuration. It is left untouched. Documents that do
              match are appended whole and are not merged with each other.

              An integrity result has no trial id. It is kept on
              ``assessment.integrity_results``, keyed by ``evaluator.id``.

              Each appended document that cites ``thresholds.json`` is checked against
              the file at that URI, relative to the result file. When ``report_dir`` is
              set, the matching bytes are copied there under the cited relative path.

              ``integrity_job`` is the run-integrity job's result (``success``, ``failure``, ``cancelled``,
              ``skipped``). Without it nothing about a missing integrity result is stored.

              ``counts``, when given, is filled with ``{evaluator id: {"appended": n,
              "skipped": m}}``.
              """
              if not isinstance(bundle, dict) or not isinstance(bundle.get("results"), list):
                  raise TypeError("bundle is missing results")
              directory = Path(directory)
              found = []
              problems: list[str] = []
              unusable: list[tuple[str, str, str]] = []  # (evaluator, file, reason)
              if directory.is_dir():
                  for path in sorted(directory.rglob("*.json")):
                      if not path.is_file() or path.is_symlink():
                          continue
                      try:
                          document = json.loads(path.read_text(encoding="utf-8"))
                      except ValueError as exc:  # truncated, invalid JSON or not UTF-8
                          _note(unusable, problems, path, directory, None, f"not valid JSON ({exc})")
                          continue
                      if (
                          isinstance(document, dict)
                          and isinstance(document.get("format"), str)
                          and RESULT_FORMAT.fullmatch(document["format"])
                      ):
                          found.append((path, document))
              by_id = {}
              for result in bundle["results"]:
                  if isinstance(result, dict) and isinstance(result.get("id"), str):
                      by_id[result["id"]] = result
              matched = []
              integrity_docs: list[dict] = []
              trial_appended = 0
              exports: dict[str, bytes] = {}
              for path, document in found:
                  evaluator = document.get("evaluator")
                  name = evaluator.get("id") if isinstance(evaluator, dict) else None
                  tally = (counts if counts is not None else {}).setdefault(
                      name if isinstance(name, str) and name else "(no evaluator id)",
                      {"appended": 0, "skipped": 0},
                  )
                  if _is_integrity(document):
                      tally["appended"] += 1
                      integrity_docs.append(document)
                      continue
                  scenario = document.get("scenario")
                  trial_id = scenario.get("trial_id") if isinstance(scenario, dict) else None
                  result = by_id.get(trial_id)
                  if result is None:
                      tally["skipped"] += 1
                      continue
                  try:
                      _take_thresholds(path, document, directory, exports)
                  except ThresholdMissingError as exc:
                      # Only the media job's results (cited under media/) are tolerated: the document is
                      # left off the report and the problem is listed. Any other missing citation fails.
                      if not exc.relative.startswith(_MEDIA_PREFIX):
                          raise
                      _note(unusable, problems, path, directory, evaluator, str(exc))
                      continue
                  tally["appended"] += 1
                  trial_appended += 1
                  matched.append((trial_id, result, document))
              for trial_id, result, document in matched:
                  entries = result.get("evaluator_results")
                  if entries is None:
                      entries = []
                      result["evaluator_results"] = entries
                  if not isinstance(entries, list):
                      raise TypeError(f"result {trial_id!r} evaluator_results is not a list")
                  entries.append(document)
              _attach_integrity(bundle, integrity_docs)
              if integrity_job and not integrity_docs:
                  refusal = _refusal(directory)
                  _attach_not_run(
                      bundle,
                      integrity_job,
                      refusal if refusal is not None else _not_run_reason(directory, integrity_job),
                      refused=refusal is not None,
                  )
              if report_dir is not None:
                  report = Path(report_dir)
                  _write_thresholds(report, exports)
                  _write_integrity_lines(report, bundle)
              # Used by main() so a run-level result cannot hide a missing trial result.
              if counts is not None:
                  counts["_trial_appended"] = trial_appended
                  counts["_problems"] = problems
                  counts["_unusable"] = unusable
              return bundle


          def _note(unusable, problems, path, directory, evaluator, reason) -> None:
              """Record a result left off the report: which file, which evaluator (if known), and why."""
              where = path.relative_to(directory).as_posix()
              if isinstance(evaluator, dict) and isinstance(evaluator.get("id"), str):
                  label = f"{evaluator['id']} {evaluator.get('version') or '(no version)'}"
              else:
                  label = "unknown"
              unusable.append((label, where, reason))
              problems.append(f"{where} [evaluator {label}]: {reason}")


          def _citations(document: dict) -> list[dict]:
              inputs = document.get("inputs")
              if not isinstance(inputs, list):
                  return []
              cited = []
              for item in inputs:
                  if not isinstance(item, dict):
                      continue
                  uri = item.get("uri")
                  if item.get("role") == "thresholds" or _file_name(uri) == _THRESHOLDS_NAME:
                      cited.append(item)
              return cited


          def _file_name(uri) -> str | None:
              if not isinstance(uri, str) or not uri or "\\" in uri or "://" in uri or uri.startswith("/"):
                  return None
              parts = PurePosixPath(uri).parts
              if not parts or any(part in ("", ".", "..") for part in parts):
                  return None
              return parts[-1]


          def _take_thresholds(result_path: Path, document: dict, results_root: Path, exports: dict) -> None:
              for item in _citations(document):
                  relative, data = _cited_file(result_path, item, results_root)
                  previous = exports.get(relative)
                  if previous is not None and previous != data:
                      raise ThresholdCitationError(
                          f"substituted: {relative} is cited with two different sha256 values"
                      )
                  exports[relative] = data


          def _cited_file(result_path: Path, item: dict, results_root: Path) -> tuple[str, bytes]:
              uri = item.get("uri")
              where = result_path.name
              if not isinstance(uri, str) or not uri or "\\" in uri or "://" in uri or uri.startswith("/"):
                  raise ThresholdCitationError(f"substituted: {where} cites {uri!r}, not thresholds.json")
              parts = PurePosixPath(uri).parts
              if not parts or any(part in ("", ".", "..") for part in parts) or parts[-1] != _THRESHOLDS_NAME:
                  raise ThresholdCitationError(
                      f"substituted: {where} cites {uri!r}, a different path than thresholds.json"
                  )
              relative = "/".join(parts)
              candidate = result_path.parent.joinpath(*parts)
              try:
                  candidate.relative_to(results_root)
              except ValueError:
                  raise ThresholdCitationError(
                      f"substituted: {where} cites {relative}, outside the results directory"
                  ) from None
              if _symlink_at_or_below(candidate, results_root):
                  raise ThresholdCitationError(
                      f"substituted: {where} cites {relative}, which is a different path"
                  )
              got = candidate.relative_to(result_path.parent).as_posix()
              if got != relative:
                  raise ThresholdCitationError(
                      f"substituted: {where} cites {relative}, but the file is {got}"
                  )
              if not candidate.is_file():
                  raise ThresholdMissingError(
                      f"missing: {where} cites {relative}, and that file is not in the results", relative
                  )
              data = candidate.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              cited = item.get("sha256")
              if not isinstance(cited, str) or _SHA256.fullmatch(cited) is None or digest != cited:
                  raise ThresholdCitationError(
                      f"altered: {relative} sha256 is {digest}, not the cited {cited!r}"
                  )
              return relative, data


          def _symlink_at_or_below(path: Path, root: Path) -> bool:
              """True when ``path`` or a directory under ``root`` is a symlink.

              Ancestors of ``root`` are not checked. A symlink at ``/tmp`` must not make
              a regular file inside a results directory look substituted.
              """
              current = path
              while True:
                  if current.is_symlink():
                      return True
                  if current == root:
                      return False
                  parent = current.parent
                  if parent == current:
                      return True
                  current = parent


          def _write_thresholds(report_dir: Path, exports: dict[str, bytes]) -> None:
              planned = []
              for relative, data in exports.items():
                  dest = report_dir.joinpath(*PurePosixPath(relative).parts)
                  if _symlink_at_or_below(dest, report_dir):
                      raise ThresholdCitationError(
                          f"substituted: {relative} would replace a different path in the report"
                      )
                  if dest.exists() and (not dest.is_file() or dest.read_bytes() != data):
                      raise ThresholdCitationError(
                          f"substituted: {relative} is already a different file in the report"
                      )
                  planned.append((dest, data))
              for dest, data in planned:
                  if dest.is_file():
                      continue
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(data)


          def _is_integrity(document: dict) -> bool:
              evaluator = document.get("evaluator")
              return isinstance(evaluator, dict) and evaluator.get("kind") == "integrity"


          _GRADED_STATUSES = frozenset({"COMPLETED", "ERROR"})


          def _integrity_failed(document: dict) -> bool:
              """True only when the integrity run was judged and failed.

              A 1.2.0 INCONCLUSIVE run (no check applied) and any run status this
              collector does not recognise are not graded, so neither is a failure
              (livingproof-evaluator#38: a 1.x minor may add run statuses).
              """
              payload = document.get("integrity") if isinstance(document.get("integrity"), dict) else {}
              run = payload.get("run") if isinstance(payload.get("run"), dict) else {}
              status = run.get("test_system_status")
              if isinstance(status, str) and status not in _GRADED_STATUSES:
                  return False
              if run.get("success") is False or run.get("conclusion") == "INCONCLUSIVE":
                  return True
              return isinstance(status, str) and status != "COMPLETED"


          def _attach_integrity(bundle: dict, documents: list[dict]) -> None:
              if not documents:
                  return
              assessment = bundle.get("assessment")
              if not isinstance(assessment, dict):
                  assessment = {}
                  bundle["assessment"] = assessment
              stored = assessment.get("integrity_results")
              if stored is None:
                  stored = {}
                  assessment["integrity_results"] = stored
              if not isinstance(stored, dict):
                  raise TypeError("assessment integrity_results is not a mapping")
              failed = False
              for document in documents:
                  evaluator = document.get("evaluator") if isinstance(document.get("evaluator"), dict) else {}
                  name = evaluator.get("id")
                  key = name if isinstance(name, str) and name else "(no evaluator id)"
                  stored[key] = document
                  if _integrity_failed(document):
                      failed = True
              if not failed:
                  return
              runs = assessment.get("runs") if isinstance(assessment.get("runs"), list) else []
              for run in runs:
                  if isinstance(run, dict):
                      run["conclusion"] = "INCONCLUSIVE"


          NOT_RUN_ID = "livingproof-run-integrity"


          REFUSED_FILE = "refused.txt"
          _MESSAGE_CAP = 500
          _INTEGRITY_ARTIFACT = re.compile(
              rf"(?:{re.escape(NOT_RUN_ID)}|(?:.*-)?evaluator-results-{re.escape(NOT_RUN_ID)}-[^/]+)"
          )


          def _is_integrity_artifact(directory: Path) -> bool:
              """True for the run-integrity job's own artifact: its inner directory, or the artifact name
              ``[<prefix>-]evaluator-results-livingproof-run-integrity-<configuration>``, not a lookalike."""
              return _INTEGRITY_ARTIFACT.fullmatch(directory.name) is not None


          def _cap(text: str) -> str:
              return text if len(text) <= _MESSAGE_CAP else text[: _MESSAGE_CAP - 3].rstrip() + "..."


          def _sentence(text: str) -> str:
              """``text`` ended with a full stop (none added when it already ends one), so a sentence can follow."""
              text = text.rstrip()
              return text if text.endswith((".", "!", "?")) else text + "."


          _REFUSED_DEFAULT = "the evaluator refused the run (exit 2) and wrote no result"


          def _refusal(directory: Path) -> str | None:
              """The evaluator's refusal message when the run-integrity step left ``refused.txt``, else None.

              The step writes it only when the evaluator exits 2, so its presence is what makes a missing
              result a refusal and not a check that never ran. Only the run-integrity artifact counts.
              """
              if not Path(directory).is_dir():
                  return None
              for note in sorted(Path(directory).rglob(REFUSED_FILE)):
                  if not _is_integrity_artifact(note.parent):
                      continue
                  try:
                      text = note.read_text(encoding="utf-8").strip()
                  except (OSError, ValueError):
                      text = ""
                  return _cap(text.splitlines()[0].strip()) if text else _REFUSED_DEFAULT
              return None


          def _not_run_reason(directory: Path, job_result: str) -> str:
              """Why there is no integrity result: the job's own note when it wrote one, else its result."""
              notes = sorted(Path(directory).rglob("no-result.txt")) if Path(directory).is_dir() else []
              for note in notes:
                  if not _is_integrity_artifact(note.parent):
                      continue  # only the run-integrity job's artifact explains a missing integrity result
                  try:
                      text = note.read_text(encoding="utf-8").strip()
                  except (OSError, ValueError):
                      continue
                  if text:
                      return _cap(text.splitlines()[0].strip())
              if job_result == "success":
                  return "the run-integrity job succeeded but left no result"
              return (
                  f"the run-integrity job ended {job_result} and left no result "
                  "(see its log; an evaluator that refuses a run exits 2 and writes none)"
              )


          def _attach_not_run(bundle: dict, job_result: str, reason: str, refused: bool = False) -> None:
              assessment = bundle.get("assessment")
              if not isinstance(assessment, dict):
                  assessment = {}
                  bundle["assessment"] = assessment
              assessment["integrity_not_run"] = {
                  "evaluator": NOT_RUN_ID,
                  "job_result": job_result,
                  "reason": reason,
              }
              if refused:
                  assessment["integrity_not_run"]["refused"] = True
              runs = assessment.get("runs") if isinstance(assessment.get("runs"), list) else []
              for run in runs:
                  if isinstance(run, dict):
                      run["conclusion"] = "INCONCLUSIVE"


          def _label(document: dict, status: str) -> str:
              """The word the report shows: PASS or FAILED, else the stored status as it is.

              Display only: the stored result keeps COMPLETED, ERROR and the rest.
              """
              if _integrity_failed(document):
                  return "FAILED"
              return "PASS" if status == "COMPLETED" else status


          def integrity_report_lines(bundle: dict) -> list[str]:
              """Plain report lines for each stored run-level integrity result."""
              assessment = bundle.get("assessment") if isinstance(bundle.get("assessment"), dict) else {}
              stored = assessment.get("integrity_results") if isinstance(assessment, dict) else None
              lines = []
              missing = assessment.get("integrity_not_run") if isinstance(assessment, dict) else None
              if isinstance(missing, dict):
                  tail = "The run is INCONCLUSIVE; the robot grade is not backed by an integrity result."
                  if missing.get("refused"):
                      lines.append(f"Run Integrity: REFUSED: {_sentence(str(missing.get('reason')))} {tail}")
                  else:
                      lines.append(
                          f"Run Integrity: NOT RUN ({missing.get('job_result')}): "
                          f"{_sentence(str(missing.get('reason')))} " + tail
                      )
              if not isinstance(stored, dict):
                  return lines
              for key, document in stored.items():
                  if not isinstance(document, dict):
                      continue
                  evaluator = document.get("evaluator") if isinstance(document.get("evaluator"), dict) else {}
                  name = evaluator.get("display_name")
                  if not isinstance(name, str) or not name.strip():
                      name = key
                  payload = document.get("integrity") if isinstance(document.get("integrity"), dict) else {}
                  run = payload.get("run") if isinstance(payload.get("run"), dict) else {}
                  status = run.get("test_system_status")
                  if not isinstance(status, str) or not status:
                      status = "UNKNOWN"
                  lines.append(f"{name}: {_label(document, status)}")
              return lines


          def _write_integrity_lines(report_dir: Path, bundle: dict) -> None:
              lines = integrity_report_lines(bundle)
              if not lines:
                  return
              report_dir.mkdir(parents=True, exist_ok=True)
              (report_dir / INTEGRITY_FILE).write_text("\n".join(lines) + "\n", encoding="utf-8")


          _VERDICT = re.compile(r"[:;] overall [A-Z][A-Za-z_ ]*\.(?:\s.*)?$")
