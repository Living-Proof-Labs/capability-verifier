# SPDX-License-Identifier: Apache-2.0
name: Verify and release
on:
  pull_request:
  push:
    branches: ['**']
permissions:
  contents: read
jobs:
  verify:
    outputs:
      source-version: ${{ steps.identity.outputs.version }}
    permissions:
      contents: read
      checks: write # Only for the test-report check; fork PR tokens remain read-only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: '3.54.0'
      - name: Identify verifier source
        id: identity
        run: echo "version=$(git describe --tags --always --long)" >> "$GITHUB_OUTPUT"
      - run: task verify
      - run: task matrix
        if: ${{ !cancelled() }}
      - name: Verify matrix with released reporter 1.6.0
        run: task matrix:report
      - name: Retain installed reporter matrix outputs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: execution-matrix-reports-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/matrix-report/
          retention-days: 14
          if-no-files-found: error
      - name: Released execution matrix
        if: ${{ !cancelled() }}
        run: cat artifacts/matrix/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: execution-matrix-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/matrix/
          retention-days: 14
          if-no-files-found: error
      - run: task demo:runs
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: verifier-demo-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/demo-inputs/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        id: demo-bundles
        if: ${{ !cancelled() }}
        with:
          name: verifier-${{ steps.identity.outputs.version }}-demo-runs-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/demo-runs/
          retention-days: 14
          if-no-files-found: error
      - name: Portable demonstration catalog
        if: ${{ !cancelled() }}
        env:
          BUNDLE_URL: ${{ steps.demo-bundles.outputs.artifact-url }}
        run: |
          echo "Five fixture demonstrations with manifests, evidence, four report formats and checksums. See the included CATALOG.md." >> "$GITHUB_STEP_SUMMARY"
          echo "[Download the catalog and portable ZIPs]($BUNDLE_URL)" >> "$GITHUB_STEP_SUMMARY"
      - run: task bundle
      - uses: actions/upload-artifact@v4
        with:
          name: portable-results-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/bundle/
          retention-days: 14
          if-no-files-found: error
      - run: task demo
        if: ${{ !cancelled() }}
      - name: Fixture capability verdicts (not robot certification)
        if: ${{ !cancelled() }}
        run: python tools/report_summary.py >> "$GITHUB_STEP_SUMMARY"
      - name: Test results in run summary
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: Verification expectation tests
          path: artifacts/results.xml,artifacts/archives.xml
          reporter: python-xunit
          report-title: Verification tests — passing expectations are not capability certification
          use-actions-summary: 'true'
          collapsed: never
          fail-on-error: 'true'
          fail-on-empty: 'true'
      - name: Test results check and failure annotations
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: Verification expectation tests
          path: artifacts/results.xml,artifacts/archives.xml
          reporter: python-xunit
          report-title: Verification tests — passing expectations are not capability certification
          use-actions-summary: 'false'
          collapsed: never
          fail-on-error: 'true'
          fail-on-empty: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/*.xml
          retention-days: 14
          if-no-files-found: error
  report:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/living-proof-labs/livingproof-capability-report:1.6.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: '3.54.0'
      - uses: actions/download-artifact@v4
        with:
          name: verifier-demo-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/demo-inputs
      - name: Extract and regenerate demo archives with installed reporter
        env:
          DEMO_VERSION: ${{ needs.verify.outputs.source-version }}
          DEMO_ARCH: ${{ matrix.architecture }}
        run: task -t Taskfile.reporter.yml test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: verifier-${{ needs.verify.outputs.source-version }}-runs-${{ matrix.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/demo-runs/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: archive-tests-${{ matrix.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/archives.xml
          retention-days: 14
          if-no-files-found: error
      - uses: actions/download-artifact@v4
        with:
          name: portable-results-${{ github.event.pull_request.head.sha || github.sha }}
          path: bundle
      - name: Validate and grade portable capability evidence
        run: |
          livingproof-capability-report --version
          livingproof-capability-report validate bundle/manifest.json
          mkdir reports
          livingproof-capability-report grade bundle/manifest.json -o reports/report.json
          livingproof-capability-report render reports/report.json --format html -o reports/report.html
          livingproof-capability-report render reports/report.json --format csv -o reports/report.csv
          livingproof-capability-report render reports/report.json > reports/report.txt
          grep -q 'Separate contexts' reports/report.txt
          python - <<'PYCODE'
          import json
          report = json.load(open("reports/report.json"))
          decisions = {d["result_id"]: d["status"] for d in report["decisions"]}
          assert len(decisions) == 8
          assert decisions["v1.1.1-slow"] == "PASS"
          assert decisions["v1.2.0-slow"] == "FAIL"
          assert decisions["v1.2.0-insufficient"] == "INSUFFICIENT_EVIDENCE"
          PYCODE
          (cd reports && sha256sum report.* > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        id: reports
        with:
          name: capability-reports-${{ matrix.architecture }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: reports/
          retention-days: 14
          if-no-files-found: error
      - name: Capability decisions and downloadable reports
        env:
          REPORT_URL: ${{ steps.reports.outputs.artifact-url }}
        run: |
          python - <<'PYCODE'
          import html, json, os
          report = json.load(open("reports/report.json"))
          results = {r["id"]: r for r in report["source_bundle"]["results"]}
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              stream.write("## Capability decisions\n\n")
              stream.write("Fixture demonstration, not robot safety certification. JUnit above records expectation tests separately.\n\n")
              stream.write("[Download offline HTML, lossless JSON and flattened CSV](" + os.environ["REPORT_URL"] + ")\n\n")
              stream.write("<table><tr><th>Result</th><th>Contract revision</th><th>Fixture version</th><th>Grade</th></tr>")
              for decision in report["decisions"]:
                  result = results[decision["result_id"]]
                  values = [result["id"], result["spec"]["revision"], result["system"]["version"], decision["status"]]
                  stream.write("<tr>" + "".join("<td>" + html.escape(v) + "</td>" for v in values) + "</tr>")
              stream.write("</table>\n")
          PYCODE
  report-results:
    needs: report
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-tests-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-results
      - name: Native archive test results
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: Native archive consumption
          path: native-results/**/archives.xml
          reporter: python-xunit
          use-actions-summary: 'true'
          collapsed: never
          fail-on-error: 'true'
          fail-on-empty: 'true'
  release:
    needs: [verify, report, report-results, documentation]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: Living-Proof-Labs/collaboration-guidelines/.github/workflows/semantic-release.yml@v2.2.0
    with:
      draft-release: true
  release-reports:
    needs: [verify, report, release]
    if: needs.release.outputs.draft-created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: '3.54.0'
      - uses: actions/download-artifact@v4
        with:
          name: verifier-${{ needs.verify.outputs.source-version }}-runs-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: verified-runs
      - name: Name bundles for the actual new release
        env:
          RELEASE_TAG: ${{ needs.release.outputs.git-tag }}
        run: task -t Taskfile.reporter.yml release
      - uses: actions/download-artifact@v4
        with:
          name: capability-reports-amd64-${{ github.sha }}
          path: reports
      - name: Attach the verified reports to this producer release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.git-tag }}
        run: |
          (cd reports && sha256sum -c SHA256SUMS)
          # Generic legacy report files remain available for existing links.
          gh release upload "$RELEASE_TAG" reports/report.* reports/SHA256SUMS --repo "$GITHUB_REPOSITORY"
          gh release upload "$RELEASE_TAG" release-runs/*.zip release-runs/CATALOG.md release-runs/BUNDLE-SHA256SUMS --repo "$GITHUB_REPOSITORY"
          gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"

  documentation:
    runs-on: ubuntu-24.04
    env:
      GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e
        with:
          version: '3.54.0'
      - run: task verify
      - run: task docs
        if: ${{ !cancelled() && hashFiles('artifacts/results.xml') != '' }}
      - run: task test:docs
        if: ${{ !cancelled() && hashFiles('artifacts/docs/html/build.json') != '' }}
      - name: Visible documentation and fixture results
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a
        with:
          name: Documentation and fixture verification
          path: artifacts/results.xml,artifacts/docs-tests.xml
          reporter: python-xunit
          use-actions-summary: 'true'
          collapsed: never
          fail-on-error: 'true'
          fail-on-empty: 'true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: preview
        if: ${{ !cancelled() }}
        with:
          name: documentation-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/docs/
            artifacts/docs-tests.xml
            artifacts/test-context.json
          retention-days: 14
          if-no-files-found: error
      - name: Download the actual review artifact for layout verification
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: documentation-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/preview-extracted
      - name: Verify shipped preview instructions against the extracted archive
        run: task docs:archive:check
      - name: Preview download
        if: ${{ !cancelled() }}
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.artifact-url }}
        run: echo "[Manual preview and individual test evidence]($PREVIEW_URL) — 14-day retention. Extract all files and serve docs/html over loopback HTTP; see docs/documentation.md." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: artifacts/docs/html
  documentation-deploy:
    needs: [documentation, verify, report, report-results]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: capability-verifier-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check current main inside deployment lock
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PYCODE'
          import json, os, urllib.request
          url = 'https://api.github.com/repos/Living-Proof-Labs/capability-verifier/git/ref/heads/main'
          with urllib.request.urlopen(url, timeout=30) as response:
              current = json.load(response)['object']['sha']
          if current != os.environ['EXPECTED_SHA']:
              raise SystemExit('Refusing stale documentation: main advanced')
          PYCODE
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        id: deployment
