# SPDX-License-Identifier: Apache-2.0
name: Verify and release
on:
  pull_request:
  push:
    branches: ['**']
permissions:
  contents: read
jobs:
  verify:
    outputs:
      source-version: ${{ steps.identity.outputs.version }}
    permissions:
      contents: read
      checks: write # Only for the test-report check; fork PR tokens remain read-only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
      - name: Validate Renovate config
        run: npx --yes --package renovate@44.237.1 renovate-config-validator --strict
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: '3.54.0'
      - name: Identify verifier source
        id: identity
        run: echo "version=$(git describe --tags --always --long)" >> "$GITHUB_OUTPUT"
      - run: task verify
      - run: task matrix
        if: ${{ !cancelled() }}
      - name: Verify matrix with released reporter 1.6.0
        run: task matrix:report
      - name: Retain installed reporter matrix outputs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: execution-matrix-reports-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/matrix-report/
          retention-days: 14
          if-no-files-found: error
      - name: Released execution matrix
        if: ${{ !cancelled() }}
        run: cat artifacts/matrix/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: execution-matrix-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/matrix/
          retention-days: 14
          if-no-files-found: error
      - run: task demo:runs
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: verifier-demo-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/demo-inputs/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        id: demo-bundles
        if: ${{ !cancelled() }}
        with:
          name: verifier-${{ steps.identity.outputs.version }}-demo-runs-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/demo-runs/
          retention-days: 14
          if-no-files-found: error
      - name: Portable demonstration catalog
        if: ${{ !cancelled() }}
        env:
          BUNDLE_URL: ${{ steps.demo-bundles.outputs.artifact-url }}
        run: |
          echo "Five fixture demonstrations with manifests, evidence, four report formats and checksums. See the included CATALOG.md." >> "$GITHUB_STEP_SUMMARY"
          echo "[Download the catalog and portable ZIPs]($BUNDLE_URL)" >> "$GITHUB_STEP_SUMMARY"
      - run: task bundle
      - uses: actions/upload-artifact@v4
        with:
          name: portable-results-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/bundle/
          retention-days: 14
          if-no-files-found: error
      - run: task demo
        if: ${{ !cancelled() }}
      - name: Fixture capability verdicts (not robot certification)
        if: ${{ !cancelled() }}
        run: python tools/report_summary.py >> "$GITHUB_STEP_SUMMARY"
      # Summary mode lists cases and does not create a check run. continue-on-error
      # keeps a reporter API failure off the job result; the next step is the gate.
      - name: Test results in run summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: Verification expectation tests
          path: artifacts/results.xml,artifacts/archives.xml
          reporter: python-xunit
          report-title: Verification tests — passing expectations are not capability certification
          use-actions-summary: 'true'
          collapsed: never
          fail-on-error: 'true'
          fail-on-empty: 'true'
      - name: JUnit gate and completed check run
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPORT_NAME: Verification expectation tests
          REPORT_PATH: artifacts/results.xml,artifacts/archives.xml
          PUBLISH_CHECK: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: python tools/test_results.py --name "$REPORT_NAME" --path "$REPORT_PATH" --publish-check "$PUBLISH_CHECK"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/*.xml
          retention-days: 14
          if-no-files-found: error
  report:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/living-proof-labs/livingproof-capability-report:1.6.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: '3.54.0'
      - uses: actions/download-artifact@v4
        with:
          name: verifier-demo-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/demo-inputs
      - name: Extract and regenerate demo archives with installed reporter
        env:
          DEMO_VERSION: ${{ needs.verify.outputs.source-version }}
          DEMO_ARCH: ${{ matrix.architecture }}
        run: task -t Taskfile.reporter.yml test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: verifier-${{ needs.verify.outputs.source-version }}-runs-${{ matrix.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/demo-runs/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: archive-tests-${{ matrix.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/archives.xml
          retention-days: 14
          if-no-files-found: error
      - uses: actions/download-artifact@v4
        with:
          name: portable-results-${{ github.event.pull_request.head.sha || github.sha }}
          path: bundle
      - name: Validate and grade portable capability evidence
        run: |
          livingproof-capability-report --version
          livingproof-capability-report validate bundle/manifest.json
          mkdir reports
          livingproof-capability-report grade bundle/manifest.json -o reports/report.json
          livingproof-capability-report render reports/report.json --format html -o reports/report.html
          livingproof-capability-report render reports/report.json --format csv -o reports/report.csv
          livingproof-capability-report render reports/report.json > reports/report.txt
          grep -q 'Separate contexts' reports/report.txt
          python - <<'PYCODE'
          import json
          report = json.load(open("reports/report.json"))
          decisions = {d["result_id"]: d["status"] for d in report["decisions"]}
          assert len(decisions) == 8
          assert decisions["v1.1.1-slow"] == "PASS"
          assert decisions["v1.2.0-slow"] == "FAIL"
          assert decisions["v1.2.0-insufficient"] == "INSUFFICIENT_EVIDENCE"
          PYCODE
          (cd reports && sha256sum report.* > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        id: reports
        with:
          name: capability-reports-${{ matrix.architecture }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: reports/
          retention-days: 14
          if-no-files-found: error
      - name: Capability decisions and downloadable reports
        env:
          REPORT_URL: ${{ steps.reports.outputs.artifact-url }}
        run: |
          python - <<'PYCODE'
          import html, json, os
          report = json.load(open("reports/report.json"))
          results = {r["id"]: r for r in report["source_bundle"]["results"]}
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              stream.write("## Capability decisions\n\n")
              stream.write("Fixture demonstration, not robot safety certification. JUnit above records expectation tests separately.\n\n")
              stream.write("[Download offline HTML, lossless JSON and flattened CSV](" + os.environ["REPORT_URL"] + ")\n\n")
              stream.write("<table><tr><th>Result</th><th>Contract revision</th><th>Fixture version</th><th>Grade</th></tr>")
              for decision in report["decisions"]:
                  result = results[decision["result_id"]]
                  values = [result["id"], result["spec"]["revision"], result["system"]["version"], decision["status"]]
                  stream.write("<tr>" + "".join("<td>" + html.escape(v) + "</td>" for v in values) + "</tr>")
              stream.write("</table>\n")
          PYCODE
  report-results:
    needs: report
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-tests-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-results
      # Summary mode does not create a check run. This job has contents: read only,
      # so the gate runs with publish-check false and does not call the Checks API.
      # A reporter API failure must not fail this job; the gate fails only for a
      # failed, missing, or unreadable report.
      - name: Native archive test results
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: Native archive consumption
          path: native-results/**/archives.xml
          reporter: python-xunit
          use-actions-summary: 'true'
          collapsed: never
          fail-on-error: 'true'
          fail-on-empty: 'true'
      - name: JUnit gate and completed check run
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPORT_NAME: Native archive consumption
          REPORT_PATH: native-results/**/archives.xml
          PUBLISH_CHECK: 'false'
        run: python tools/test_results.py --name "$REPORT_NAME" --path "$REPORT_PATH" --publish-check "$PUBLISH_CHECK"
  release:
    needs: [verify, report, report-results, documentation]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: Living-Proof-Labs/collaboration-guidelines/.github/workflows/semantic-release.yml@v9.2.0
    with:
      draft-release: true
  release-reports:
    # Publishes the draft release, so it waits for every hallway image job: a failed image never
    # gets a published release. Explicit results, because a skipped/failed need must stop this
    # job rather than be ignored; the merge job has already added the image line to the draft.
    needs:
      - verify
      - report
      - release
      - hallway-image-tag
      - hallway-image-build
      - hallway-image-merge
      - hallway-image-verify
    if: >-
      ${{ !cancelled()
      && needs.release.outputs.draft-created == 'true'
      && needs.verify.result == 'success'
      && needs.report.result == 'success'
      && needs.release.result == 'success'
      && needs.hallway-image-tag.result == 'success'
      && needs.hallway-image-build.result == 'success'
      && needs.hallway-image-merge.result == 'success'
      && needs.hallway-image-verify.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: '3.54.0'
      # The report job may have run in an earlier attempt than this one (a "re-run failed jobs"
      # after a flaky documentation test keeps report's attempt-1 artifact), so match any attempt
      # of this run and use the newest. github.run_attempt is this job's attempt, not report's.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: verifier-${{ needs.verify.outputs.source-version }}-runs-amd64-${{ github.run_id }}-*
          path: verified-runs-attempts
      - name: Use the newest report attempt's verified runs
        env:
          PREFIX: verifier-${{ needs.verify.outputs.source-version }}-runs-amd64-${{ github.run_id }}-
        run: |
          latest=$(find verified-runs-attempts -mindepth 1 -maxdepth 1 -type d -name "$PREFIX*" \
            | sed "s|^verified-runs-attempts/$PREFIX||" | sort -n | tail -n1)
          [ -n "$latest" ] || { echo "no $PREFIX<attempt> artifact in this run" >&2; exit 1; }
          echo "using ${PREFIX}${latest}"
          mv "verified-runs-attempts/${PREFIX}${latest}" verified-runs
      - name: Name bundles for the actual new release
        env:
          RELEASE_TAG: ${{ needs.release.outputs.git-tag }}
        run: task -t Taskfile.reporter.yml release
      - uses: actions/download-artifact@v4
        with:
          name: capability-reports-amd64-${{ github.sha }}
          path: reports
      - name: Attach the verified reports to this producer release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.git-tag }}
        run: |
          (cd reports && sha256sum -c SHA256SUMS)
          # Generic legacy report files remain available for existing links.
          gh release upload "$RELEASE_TAG" reports/report.* reports/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$RELEASE_TAG" release-runs/*.zip release-runs/CATALOG.md release-runs/BUNDLE-SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"

  hallway-image-tag:
    # Version tags are never retagged: an existing image:<version> fails the release. Only an
    # explicit registry "manifest unknown"/not-found counts as absent; any other error fails.
    needs: [release]
    if: needs.release.outputs.draft-created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      packages: read
    env:
      IMAGE: ghcr.io/living-proof-labs/capability-verifier-hallway
      RELEASE_TAG: ${{ needs.release.outputs.git-tag }}
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.release.outputs.git-tag }}
          persist-credentials: false
      - name: Refuse to retag an existing version
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          version="${RELEASE_TAG#v}"
          .github/scripts/hallway-tag-absent.sh "$IMAGE:$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  hallway-image-build:
    # Native per-arch builds (livingproof's amd64/arm64 runner matrix), pushed by digest only:
    # no per-arch tags. hallway-image-merge makes the image:<version> index from these digests.
    needs: [release, hallway-image-tag]
    strategy:
      fail-fast: true
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - architecture: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/living-proof-labs/capability-verifier-hallway
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.release.outputs.git-tag }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build and push ${{ matrix.platform }} by digest
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker buildx build --platform "$PLATFORM" --target hallway \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file metadata.json .
          digest=$(jq -er '."containerimage.digest"' metadata.json)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "$digest" > "digest-${{ matrix.architecture }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hallway-digest-${{ matrix.architecture }}
          path: digest-${{ matrix.architecture }}
          if-no-files-found: error
          retention-days: 1

  hallway-image-merge:
    needs: [release, hallway-image-tag, hallway-image-build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/living-proof-labs/capability-verifier-hallway
      VERSION: ${{ needs.hallway-image-tag.outputs.version }}
    outputs:
      digest: ${{ steps.create.outputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.release.outputs.git-tag }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: hallway-digest-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Create the image:<version> index (no-retag check again first)
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          .github/scripts/hallway-tag-absent.sh "$IMAGE:$VERSION"
          amd64=$(cat digests/digest-amd64); arm64=$(cat digests/digest-arm64)
          # Check the index before anything is pushed: --dry-run prints it without pushing.
          # Attestation manifests (unknown/unknown) are kept; only real platforms are counted.
          docker buildx imagetools create --dry-run -t "$IMAGE:$VERSION" "$IMAGE@$amd64" "$IMAGE@$arm64" > index.json
          python3 .github/scripts/hallway_index_platforms.py < index.json
          docker buildx imagetools create -t "$IMAGE:$VERSION" "$IMAGE@$amd64" "$IMAGE@$arm64"
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -er .digest)
          docker buildx imagetools inspect "$IMAGE@$digest" --raw | python3 .github/scripts/hallway_index_platforms.py
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Record the index digest in the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.git-tag }}
          DIGEST: ${{ steps.create.outputs.digest }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          # shellcheck disable=SC2016 # the backticks are Markdown, not a substitution
          printf '\n## Hallway image (linux/amd64, linux/arm64 index)\n\n`%s:%s@%s`\n' "$IMAGE" "$VERSION" "$DIGEST" >> notes.md
          # Per-version notes (e.g. an earlier image left published but unverified).
          if [ -f ".github/release-notes/$VERSION.md" ]; then
            printf '\n' >> notes.md
            cat ".github/release-notes/$VERSION.md" >> notes.md
          fi
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md

  hallway-image-verify:
    # Pull image@index-digest natively on each arch and reproduce the stock G1 hallway result.
    needs: [release, hallway-image-merge]
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            machine: x86_64
          - architecture: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      REF: ghcr.io/living-proof-labs/capability-verifier-hallway@${{ needs.hallway-image-merge.outputs.digest }}
      ARCH: ${{ matrix.architecture }}
      MACHINE: ${{ matrix.machine }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.release.outputs.git-tag }}
          persist-credentials: false
          path: cv
      - name: Check out livingproof-verification at the image's lock commit
        id: lock
        run: |
          commit=$(sed -n 's/^ARG VERIFICATION_LOCK_COMMIT=//p' cv/Dockerfile)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Living-Proof-Labs/livingproof-verification
          ref: ${{ steps.lock.outputs.commit }}
          persist-credentials: false
          path: lpv
      - name: Pull natively, with no platform mismatch
        run: |
          [ "$(uname -m)" = "$MACHINE" ] || { echo "runner is $(uname -m), expected $MACHINE" >&2; exit 1; }
          docker pull "$REF" 2>&1 | tee pull.log
          if grep -qi 'platform' pull.log; then echo "platform warning on pull" >&2; exit 1; fi
          image_arch=$(docker image inspect "$REF" --format '{{.Architecture}}')
          [ "$image_arch" = "$ARCH" ] || { echo "pulled $image_arch, expected $ARCH" >&2; exit 1; }
          in_container=$(docker run --rm --entrypoint uname "$REF" -m)
          [ "$in_container" = "$MACHINE" ] || { echo "container is $in_container, expected $MACHINE" >&2; exit 1; }
      - name: Reproduce stock G1 hallway 12/20 FAIL
        working-directory: lpv
        run: |
          set +e
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/work" "$REF" \
            capability verify run --reporter source verifications/unitree-g1-stock-mujoco-hallway.toml 2>&1 | tee ../verify.log
          set -e
          expected='12/20 trials PASS (needs 18), Wilson 95% [0.3866, 0.7812]: FAIL'
          grep -qF "$expected" ../verify.log || { echo "did not reproduce: $expected" >&2; exit 1; }
          echo "$ARCH: \`$expected\`" >> "$GITHUB_STEP_SUMMARY"

  hallway-image-pr:
    # PR dry run of the release's per-arch build + verify, natively on each arch. Nothing is
    # pushed or tagged: the image is loaded into the runner's docker and there is no merge/index.
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
            machine: x86_64
          - architecture: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      REF: capability-verifier-hallway:pr-${{ matrix.architecture }}
      ARCH: ${{ matrix.architecture }}
      MACHINE: ${{ matrix.machine }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          path: cv
      - name: Read the image's lock commit
        id: lock
        run: |
          commit=$(sed -n 's/^ARG VERIFICATION_LOCK_COMMIT=//p' cv/Dockerfile)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Living-Proof-Labs/livingproof-verification
          ref: ${{ steps.lock.outputs.commit }}
          persist-credentials: false
          path: lpv
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build ${{ matrix.platform }} natively and load it (no push, no tag on a registry)
        working-directory: cv
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          [ "$(uname -m)" = "$MACHINE" ] || { echo "runner is $(uname -m), expected $MACHINE" >&2; exit 1; }
          docker buildx build --platform "$PLATFORM" --target hallway --load -t "$REF" . 2>&1 | tee ../build.log
          if grep -Ei 'warn.*platform|platform.*(mismatch|does not match)' ../build.log; then
            echo "platform warning on build" >&2; exit 1
          fi
      - name: Check the loaded image runs natively, with no platform mismatch
        run: |
          image_arch=$(docker image inspect "$REF" --format '{{.Architecture}}')
          [ "$image_arch" = "$ARCH" ] || { echo "built $image_arch, expected $ARCH" >&2; exit 1; }
          docker run --rm --entrypoint uname "$REF" -m > run.log 2>&1
          cat run.log
          if grep -qi 'platform' run.log; then echo "platform warning on run" >&2; exit 1; fi
          [ "$(tail -n1 run.log)" = "$MACHINE" ] || { echo "container is not $MACHINE" >&2; exit 1; }
      - name: Reproduce stock G1 hallway 12/20 FAIL
        working-directory: lpv
        run: |
          set +e
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/work" "$REF" \
            capability verify run --reporter source verifications/unitree-g1-stock-mujoco-hallway.toml 2>&1 | tee ../verify.log
          set -e
          expected='12/20 trials PASS (needs 18), Wilson 95% [0.3866, 0.7812]: FAIL'
          grep -qF "$expected" ../verify.log || { echo "did not reproduce: $expected" >&2; exit 1; }
          echo "$ARCH: \`$expected\`" >> "$GITHUB_STEP_SUMMARY"

  documentation:
    runs-on: ubuntu-24.04
    env:
      GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e
        with:
          version: '3.54.0'
      - run: task verify
      - run: task docs
        if: ${{ !cancelled() && hashFiles('artifacts/results.xml') != '' }}
      - run: task test:docs
        if: ${{ !cancelled() && hashFiles('artifacts/docs/html/build.json') != '' }}
      # Summary mode does not create a check run. This job has contents: read only,
      # so the gate runs with publish-check false and does not call the Checks API.
      # continue-on-error keeps a reporter API failure off the job result; the next
      # step is the gate.
      - name: Visible documentation and fixture results
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a
        with:
          name: Documentation and fixture verification
          path: artifacts/results.xml,artifacts/docs-tests.xml
          reporter: python-xunit
          use-actions-summary: 'true'
          collapsed: never
          fail-on-error: 'true'
          fail-on-empty: 'true'
      - name: JUnit gate and completed check run
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPORT_NAME: Documentation and fixture verification
          REPORT_PATH: artifacts/results.xml,artifacts/docs-tests.xml
          PUBLISH_CHECK: 'false'
        run: python tools/test_results.py --name "$REPORT_NAME" --path "$REPORT_PATH" --publish-check "$PUBLISH_CHECK"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: preview
        if: ${{ !cancelled() }}
        with:
          name: documentation-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/docs/
            artifacts/docs-tests.xml
            artifacts/test-context.json
          retention-days: 14
          if-no-files-found: error
      - name: Download the actual review artifact for layout verification
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: documentation-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/preview-extracted
      - name: Verify shipped preview instructions against the extracted archive
        run: task docs:archive:check
      - name: Preview download
        if: ${{ !cancelled() }}
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.artifact-url }}
        run: echo "[Manual preview and individual test evidence]($PREVIEW_URL) — 14-day retention. Extract all files and serve docs/html over loopback HTTP; see docs/documentation.md." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: artifacts/docs/html
  documentation-deploy:
    needs: [documentation, verify, report, report-results]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: capability-verifier-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check current main inside deployment lock
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PYCODE'
          import json, os, urllib.request
          url = 'https://api.github.com/repos/Living-Proof-Labs/capability-verifier/git/ref/heads/main'
          with urllib.request.urlopen(url, timeout=30) as response:
              current = json.load(response)['object']['sha']
          if current != os.environ['EXPECTED_SHA']:
              raise SystemExit('Refusing stale documentation: main advanced')
          PYCODE
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        id: deployment
