# SPDX-License-Identifier: Apache-2.0
version: '3'
env:
  SOURCE_COMMIT:
    sh: 'if [ -n "$SOURCE_COMMIT" ]; then echo "$SOURCE_COMMIT"; else git rev-parse HEAD; fi'
tasks:
  setup:
    cmds:
      - mkdir -p artifacts
      - docker compose build verifier
  check:
    cmds:
      - mkdir -p artifacts
      - docker compose run --build --rm verifier check
  test:
    cmds:
      - mkdir -p artifacts
      - docker compose run --build --rm verifier test
  verify:
    cmds:
      - mkdir -p artifacts
      - docker compose run --build --rm verifier verify
  demo:
    desc: Build the runtime and execute the fixture hello-world
    cmds:
      - mkdir -p artifacts
      - docker compose run --build --rm verifier demo
  bundle:
    desc: Export portable result bundles through the prepared runtime
    cmds:
      - mkdir -p artifacts
      - docker compose run --build --rm verifier bundle
  matrix:
    desc: Export four released execution coordinates plus separate evidence controls
    cmds:
      - mkdir -p artifacts
      - docker compose run --build --rm verifier matrix
  matrix:report:
    desc: Check a versioned installed reporter image against the matrix and controls
    cmds:
      - bash tools/matrix_report.sh
  demo:inputs:
    desc: Export five related fixture manifests
    cmds:
      - mkdir -p artifacts
      - docker compose run --build --rm verifier demo:inputs
  demo:report:
    desc: Package and test self-contained ZIPs with released reporter 1.6.0
    cmds:
      - bash tools/demo_report.sh
  demo:runs:
    desc: Produce the catalog and portable run ZIPs
    cmds:
      - task: demo:inputs
      - task: demo:report
  docs:
    desc: Build the Markdown manual in the shared runtime
    cmds:
      - docker compose run --build --rm documentation docs
  docs:test:setup:
    desc: Prepare the pinned documentation browser in the shared runtime
    cmds:
      - docker compose build documentation
  test:docs:
    desc: Verify the manual in the shared runtime
    cmds:
      - docker compose run --build --rm documentation test:docs
  docs:archive:check:
    desc: Check the downloaded artifact using its shipped preview instructions
    cmds:
      - docker compose run --build --rm verifier docs:archive:check
