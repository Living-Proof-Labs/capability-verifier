services:
  verifier:
    build:
      context: .
      target: runtime
      secrets:
        - ca
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:?Run through Task to record the source commit}
        LIVINGPROOF_VERIFIER_VERSION: ${LIVINGPROOF_VERIFIER_VERSION:-}
    environment:
      GITHUB_RUN_URL: ${GITHUB_RUN_URL:-local run}
      # Empty unless a published release build sets them. Pytest records the tag
      # only when all three name a plain vX.Y.Z on this commit.
      RELEASE_PUBLISHED: ${RELEASE_PUBLISHED:-}
      RELEASE_TAG: ${RELEASE_TAG:-}
      RELEASE_COMMIT: ${RELEASE_COMMIT:-}
    volumes:
      - ./artifacts:/app/artifacts
  documentation:
    extends: verifier
    environment:
      DOCS_RELEASE_TAG: ${DOCS_RELEASE_TAG:-}
      DOCS_RELEASE_RUN_ID: ${DOCS_RELEASE_RUN_ID:-}
      DOCS_RELEASE_RUN_ATTEMPT: ${DOCS_RELEASE_RUN_ATTEMPT:-}
    build:
      target: documentation
secrets:
  ca:
    file: ${HOST_BUILD_CA_FILE:-./tools/empty-ca.pem}
