# SPDX-License-Identifier: Apache-2.0
services:
  verifier:
    build:
      context: .
      target: runtime
      secrets:
        - ca
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:?Run through Task to record the source commit}
    environment:
      GITHUB_RUN_URL: ${GITHUB_RUN_URL:-local run}
    volumes:
      - ./artifacts:/app/artifacts
  documentation:
    extends: verifier
    build:
      target: documentation
secrets:
  ca:
    file: ${HOST_BUILD_CA_FILE:-./tools/empty-ca.pem}
