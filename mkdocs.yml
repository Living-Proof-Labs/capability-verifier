# SPDX-License-Identifier: Apache-2.0
site_name: Capability verifier
site_url: https://docs.livingprooflabs.com/capability-verifier/
repo_url: https://github.com/Living-Proof-Labs/capability-verifier
repo_name: Source
use_directory_urls: false
strict: true
docs_dir: artifacts/docs/source
site_dir: artifacts/docs/html
nav:
  - Documentation home: https://docs.livingprooflabs.com/
  - Start here: index.md
  - Guides: docs/guides.md
  - Reference:
      - Tasks: tasks.md
  - Scenarios and results: scenarios.md
  - Verification: docs/documentation.md
  - Contribute: docs/contributing.md
  - Version and source: provenance.md
  - Operations and history:
      - Pages deployment: pages.md
      - Historical matrix validation: docs/matrix-validation.md
  - License: docs/license.md
theme:
  name: zensical
  font: false
  palette:
    - media: '(prefers-color-scheme)'
      toggle: {icon: lucide/sun-moon, name: Switch to light mode}
    - media: '(prefers-color-scheme: light)'
      scheme: default
      toggle: {icon: lucide/sun, name: Switch to dark mode}
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      toggle: {icon: lucide/moon, name: Switch to system preference}
markdown_extensions:
  - tables
  - toc: {permalink: true}
  - pymdownx.superfences
